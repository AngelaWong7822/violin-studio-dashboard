<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Schedule</title>
<link rel="stylesheet" href="shared.css" />
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="logo.png" alt="" class="brand-logo">Violin Studio</span>
  <a href="index.html" class="active" data-i18n="nav.schedule">Schedule</a>
  <a href="leads.html" data-i18n="nav.leads">Leads</a>
  <a href="packages.html" data-i18n="nav.packages">Packages</a>
  <a href="private.html" data-i18n="nav.private">Private Students</a>
  <a href="receipt.html" data-i18n="nav.receipt">Receipt</a>
  <a href="accounting.html" data-i18n="nav.accounting">Accounting</a>
  <span class="spacer"></span>
  <div class="settings-wrap">
    <button id="settings-btn" title="Settings">⚙️</button>
    <div id="settings-menu" class="settings-menu" style="display:none;">
      <button id="settings-lang-toggle" data-lang-toggle>中文</button>
      <button id="settings-export-btn" data-i18n="settings.export_data">Export all data (Excel)</button>
    </div>
  </div>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <h1 style="margin:0;" data-i18n="schedule.title">This Week</h1>
      <div style="display:flex; gap:8px; align-items:center;">
        <select id="type-filter">
          <option value="all" data-i18n="schedule.filter_all">All types</option>
          <option value="consultation" data-i18n="type.consultation">Consultation</option>
          <option value="lesson" data-i18n="type.lesson">Lesson</option>
          <option value="group_class" data-i18n="type.group_class">Group class</option>
        </select>
        <button class="primary" id="new-appt-btn" data-i18n="schedule.new_appt">+ New appointment</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th data-i18n="schedule.col_when">When</th>
          <th data-i18n="schedule.col_type">Type</th>
          <th data-i18n="schedule.col_with">With</th>
          <th data-i18n="schedule.col_status">Status</th>
          <th data-i18n="schedule.col_paid">Paid</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="appt-rows">
        <tr><td colspan="6" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h1 data-i18n="schedule.calendar_title">Shared Google Calendar</h1>
    <div id="calendar-embed"></div>
  </div>
</main>

<!-- New/Edit appointment dialog -->
<dialog id="appt-dialog" style="border:none; border-radius:10px; padding:0; width:360px;">
  <form id="appt-form" class="card" style="margin:0; box-shadow:none;">
    <h1 id="appt-dialog-title" data-i18n="dialog.new_title">New appointment</h1>
    <input type="hidden" id="appt-id" />
    <div style="display:flex; flex-direction:column; gap:10px;">
      <label><span data-i18n="dialog.type">Type</span>
        <select id="appt-type" required>
          <option value="consultation" data-i18n="type.consultation">Consultation</option>
          <option value="lesson" data-i18n="type.lesson">Lesson</option>
          <option value="group_class" data-i18n="type.group_class">Group class</option>
        </select>
      </label>
      <label id="appt-format-row"><span data-i18n="dialog.lesson_format">Lesson format</span>
        <select id="appt-format"></select>
      </label>
      <label><span data-i18n="dialog.contact">Contact name / phone</span>
        <input type="text" id="appt-contact" data-i18n-placeholder="dialog.contact_placeholder" placeholder="e.g. Chan Tai Man / 9123 4567" required />
      </label>
      <label><span data-i18n="dialog.start">Start</span>
        <input type="datetime-local" id="appt-start" required />
      </label>
      <label><span data-i18n="dialog.end">End</span>
        <input type="datetime-local" id="appt-end" required />
      </label>
      <label><span data-i18n="dialog.price">Price</span>
        <input type="number" id="appt-price" min="0" data-i18n-placeholder="dialog.price_placeholder" placeholder="e.g. 750" />
      </label>
      <label><span data-i18n="dialog.status">Status</span>
        <select id="appt-status">
          <option value="confirmed" data-i18n="status.confirmed">Confirmed</option>
          <option value="pending_confirmation" data-i18n="status.pending_confirmation">Pending confirmation</option>
          <option value="completed" data-i18n="status.completed">Completed</option>
          <option value="cancelled" data-i18n="status.cancelled">Cancelled</option>
          <option value="no_show" data-i18n="status.no_show">No show</option>
        </select>
      </label>
      <label><input type="checkbox" id="appt-paid" /> <span data-i18n="dialog.paid">Paid</span></label>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
        <button type="button" class="link" id="appt-cancel-btn" data-i18n="dialog.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="dialog.save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  initSettingsMenu();
  window.onLangChange = () => { loadAppointments(); };

  // Google Calendar embed — replace GOOGLE_CALENDAR_EMBED_ID in supabase-config.js
  document.getElementById("calendar-embed").innerHTML =
    `<iframe src="https://calendar.google.com/calendar/embed?src=${encodeURIComponent(GOOGLE_CALENDAR_EMBED_ID)}&ctz=Asia%2FHong_Kong"
      style="border:0" width="100%" height="500" frameborder="0" scrolling="no"></iframe>`;

  const dialog = document.getElementById("appt-dialog");
  const form = document.getElementById("appt-form");
  const typeSelect = document.getElementById("appt-type");
  const formatRow = document.getElementById("appt-format-row");

  function syncFormatRowVisibility() {
    // Group class is inherently "group" format — no need to ask. Consultations
    // also need this (Angela wants to know upfront whether it's a 1-on-1 or
    // group-class inquiry), so show it for both lesson and consultation —
    // consultations get an extra "group" option since that's a valid inquiry type.
    const type = typeSelect.value;
    formatRow.style.display = type === "group_class" ? "none" : "";
    const formatSelect = document.getElementById("appt-format");
    const options = type === "consultation" ? ["1on1", "1on2", "group"] : ["1on1", "1on2"];
    const prevValue = formatSelect.value;
    formatSelect.innerHTML = options.map(f => `<option value="${f}">${t("format." + f)}</option>`).join("");
    if (options.includes(prevValue)) formatSelect.value = prevValue;
  }
  typeSelect.addEventListener("change", syncFormatRowVisibility);

  // Smart default duration so Angela only has to pick a start time —
  // consultations are always 20min, group class is always 1hr, lessons
  // default to 45min (she can still manually override for the odd 1hr lesson).
  const DEFAULT_DURATION_MINUTES = { consultation: 20, lesson: 45, group_class: 60 };
  function autoFillEnd() {
    const startVal = document.getElementById("appt-start").value;
    if (!startVal) return;
    const minutes = DEFAULT_DURATION_MINUTES[typeSelect.value] ?? 45;
    const start = new Date(startVal);
    const end = new Date(start.getTime() + minutes * 60000);
    document.getElementById("appt-end").value = toLocalInput(end.toISOString());
  }
  document.getElementById("appt-start").addEventListener("change", autoFillEnd);
  typeSelect.addEventListener("change", autoFillEnd);

  document.getElementById("new-appt-btn").addEventListener("click", () => {
    form.reset();
    document.getElementById("appt-id").value = "";
    document.getElementById("appt-dialog-title").textContent = t("dialog.new_title");
    syncFormatRowVisibility();
    dialog.showModal();
  });
  document.getElementById("appt-cancel-btn").addEventListener("click", () => dialog.close());
  document.getElementById("type-filter").addEventListener("change", loadAppointments);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("appt-id").value;
    const type = typeSelect.value;
    const priceValue = document.getElementById("appt-price").value;
    const payload = {
      type,
      lesson_format: type === "group_class" ? "group" : document.getElementById("appt-format").value,
      price: priceValue === "" ? null : parseFloat(priceValue),
      scheduled_start: new Date(document.getElementById("appt-start").value).toISOString(),
      scheduled_end: new Date(document.getElementById("appt-end").value).toISOString(),
      status: document.getElementById("appt-status").value,
      paid: document.getElementById("appt-paid").checked,
      notes: document.getElementById("appt-contact").value,
      created_via: "manual_dashboard",
    };
    let error;
    if (id) {
      ({ error } = await supabaseClient.from("appointments").update(payload).eq("id", id));
    } else {
      ({ error } = await supabaseClient.from("appointments").insert(payload));
    }
    if (error) { showToast("Save failed: " + error.message, "error"); return; }
    dialog.close();
    await loadAppointments();
  });

  function apptRowHtml(a) {
    // Show the lesson format alongside the type for consultations/lessons
    // (e.g. "諮詢 (小組班)") so Angela can tell at a glance whether a
    // consultation is a 1-on-1 or group-class inquiry. Redundant for group
    // class appointments (type already says so), so skip there.
    const typeLabel = a.lesson_format && a.type !== "group_class"
      ? `${t("type." + a.type)} (${t("format." + a.lesson_format)})`
      : t("type." + a.type);
    return `
      <tr>
        <td>${new Date(a.scheduled_start).toLocaleString(localeForDates(), { dateStyle: "medium", timeStyle: "short" })}</td>
        <td>${typeLabel}</td>
        <td>${a.notes ?? ""}</td>
        <td><span class="status-pill status-${a.status}">${t("status." + a.status)}</span></td>
        <td>${a.paid ? "✅" : "—"}</td>
        <td><button class="link" data-id="${a.id}">${t("schedule.edit")}</button></td>
      </tr>`;
  }

  async function loadAppointments() {
    const tbody = document.getElementById("appt-rows");
    const filter = document.getElementById("type-filter").value;
    const now = new Date();
    const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
    const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
    let query = supabaseClient.from("appointments").select("*")
      .gte("scheduled_start", startOfDay.toISOString())
      .lte("scheduled_start", endOfDay.toISOString())
      .order("scheduled_start", { ascending: true });
    if (filter !== "all") query = query.eq("type", filter);
    const { data, error } = await query;

    if (error) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">Error: ${error.message}</td></tr>`;
      return;
    }
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${t("schedule.empty")}</td></tr>`;
      return;
    }

    // Group-class lessons that belong to the same package are collapsed into one
    // summary row (weekly day/time + lesson count) — clicking it expands the
    // individual lessons, since a full 8-week package otherwise buries the
    // consultations Angela actually needs to keep an eye on.
    const rowsHtml = [];
    const renderedPackages = new Set();
    for (const a of data) {
      if (a.package_id) {
        if (renderedPackages.has(a.package_id)) continue;
        renderedPackages.add(a.package_id);
        const group = data
          .filter(x => x.package_id === a.package_id)
          .sort((x, y) => new Date(x.scheduled_start) - new Date(y.scheduled_start));
        const first = group[0];
        const d = new Date(first.scheduled_start);
        const dayLabel = t("day." + d.getDay());
        const timeLabel = d.toLocaleTimeString(localeForDates(), { hour: "2-digit", minute: "2-digit" });
        const summaryLabel = `${dayLabel} ${timeLabel} — ${first.notes ?? ""} (${tf("schedule.group_lessons_count", { n: group.length })})`;
        rowsHtml.push(`
          <tr class="pkg-summary-row" data-pkg-toggle="${a.package_id}" style="cursor:pointer; background:#fafafa;">
            <td colspan="2"><span class="pkg-arrow">▶</span> ${t("type.group_class")}</td>
            <td colspan="4">${summaryLabel}</td>
          </tr>
        `);
        group.forEach(g => {
          rowsHtml.push(apptRowHtml(g).replace("<tr>", `<tr class="pkg-child-row" data-pkg-child="${a.package_id}" style="display:none;">`));
        });
      } else {
        rowsHtml.push(apptRowHtml(a));
      }
    }
    tbody.innerHTML = rowsHtml.join("");

    tbody.querySelectorAll("button[data-id]").forEach(btn => {
      btn.addEventListener("click", () => openEdit(data.find(a => a.id === btn.dataset.id)));
    });

    tbody.querySelectorAll("tr[data-pkg-toggle]").forEach(row => {
      row.addEventListener("click", () => {
        const pkgId = row.dataset.pkgToggle;
        const childRows = tbody.querySelectorAll(`tr[data-pkg-child="${pkgId}"]`);
        const isHidden = childRows[0]?.style.display === "none";
        childRows.forEach(r => { r.style.display = isHidden ? "" : "none"; });
        row.querySelector(".pkg-arrow").textContent = isHidden ? "▼" : "▶";
      });
    });
  }

  function openEdit(a) {
    document.getElementById("appt-id").value = a.id;
    document.getElementById("appt-dialog-title").textContent = t("dialog.edit_title");
    document.getElementById("appt-type").value = a.type;
    syncFormatRowVisibility();
    if (a.lesson_format && a.lesson_format !== "group") {
      document.getElementById("appt-format").value = a.lesson_format;
    } else if (a.type === "consultation" && a.lesson_format === "group") {
      document.getElementById("appt-format").value = "group";
    }
    document.getElementById("appt-price").value = a.price ?? "";
    document.getElementById("appt-contact").value = a.notes ?? "";
    document.getElementById("appt-start").value = toLocalInput(a.scheduled_start);
    document.getElementById("appt-end").value = toLocalInput(a.scheduled_end);
    document.getElementById("appt-status").value = a.status;
    document.getElementById("appt-paid").checked = a.paid;
    dialog.showModal();
  }

  function toLocalInput(iso) {
    const d = new Date(iso);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  await loadAppointments();
})();
</script>
</body>
</html>
