<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Attendance</title>
<link rel="stylesheet" href="shared.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topnav">
  <span class="brand">🎻 Violin Studio</span>
  <a href="index.html" data-i18n="nav.schedule">Schedule</a>
  <a href="availability.html" data-i18n="nav.availability">Availability</a>
  <a href="leads.html" data-i18n="nav.leads">Leads</a>
  <a href="attendance.html" class="active" data-i18n="nav.attendance">Attendance</a>
  <a href="payments.html" data-i18n="nav.payments">Payments</a>
  <a href="packages.html" data-i18n="nav.packages">Packages</a>
  <span class="spacer"></span>
  <button data-lang-toggle onclick="toggleLang()">中文</button>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main>
  <div class="card">
    <h1 data-i18n="attendance.title">Attendance</h1>
    <label><span data-i18n="attendance.session">Session</span>
      <select id="appt-select" style="width:100%; max-width:480px;"></select>
    </label>

    <div id="leave-warning" class="empty" style="display:none; color:#8a2e2e; font-style:normal;"></div>

    <div id="roster-section" style="margin-top:16px; display:none;">
      <table>
        <thead><tr>
          <th data-i18n="attendance.col_student">Student</th>
          <th data-i18n="attendance.col_attended">Status</th>
          <th data-i18n="attendance.col_makeup">Make-up</th>
        </tr></thead>
        <tbody id="roster-rows"></tbody>
      </table>

      <form id="add-student-form" class="inline" style="margin-top:14px;">
        <select id="student-select" style="min-width:220px;"></select>
        <button type="submit" class="primary" data-i18n="attendance.add_to_roster">Add to roster</button>
      </form>
    </div>
    <p id="empty-msg" class="empty" data-i18n="attendance.empty_sessions" style="display:none;">No upcoming/recent lessons or group classes yet — add one from the Schedule tab.</p>
  </div>
</main>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  window.onLangChange = () => loadAppointments();

  const apptSelect = document.getElementById("appt-select");
  const rosterSection = document.getElementById("roster-section");
  const rosterRows = document.getElementById("roster-rows");
  const studentSelect = document.getElementById("student-select");
  const leaveWarningEl = document.getElementById("leave-warning");
  let appointments = [];
  let students = [];

  async function loadAppointments() {
    const { data, error } = await supabaseClient
      .from("appointments")
      .select("*")
      .in("type", ["lesson", "group_class"])
      .order("scheduled_start", { ascending: false })
      .limit(50);
    if (error) { alert("Load failed: " + error.message); return; }
    appointments = data;
    if (!data.length) {
      document.getElementById("empty-msg").style.display = "block";
      return;
    }
    apptSelect.innerHTML = data.map(a => `
      <option value="${a.id}">
        ${new Date(a.scheduled_start).toLocaleString(localeForDates(), { dateStyle: "medium", timeStyle: "short" })}
        — ${t("type." + a.type)}${a.notes ? " — " + a.notes : ""}
      </option>
    `).join("");
    await loadRoster(apptSelect.value);
  }

  async function loadStudents() {
    const { data, error } = await supabaseClient
      .from("students")
      .select("id, contacts(name)")
      .eq("active", true);
    if (error) return;
    students = data;
    studentSelect.innerHTML = data.map(s => `<option value="${s.id}">${s.contacts?.name ?? s.id}</option>`).join("");
  }

  async function checkLeaveWarning(appointmentId) {
    leaveWarningEl.style.display = "none";
    const appt = appointments.find(a => a.id === appointmentId);
    if (!appt?.package_id) return;

    const { data: pkg } = await supabaseClient
      .from("packages")
      .select("leave_limit")
      .eq("id", appt.package_id)
      .single();
    if (!pkg) return;

    const { data: pkgAppts } = await supabaseClient
      .from("appointments")
      .select("id")
      .eq("package_id", appt.package_id);
    const apptIds = (pkgAppts ?? []).map(a => a.id);
    if (!apptIds.length) return;

    const { count } = await supabaseClient
      .from("attendance")
      .select("id", { count: "exact", head: true })
      .in("appointment_id", apptIds)
      .eq("status", "leave");

    if ((count ?? 0) > pkg.leave_limit) {
      leaveWarningEl.textContent = tf("attendance.leave_warning", { n: count, limit: pkg.leave_limit });
      leaveWarningEl.style.display = "block";
    }
  }

  function makeupOptionsHtml(currentAppointmentId, selectedId) {
    const others = appointments.filter(a => a.type === "group_class" && a.id !== currentAppointmentId);
    return others.map(a => `
      <option value="${a.id}" ${a.id === selectedId ? "selected" : ""}>
        ${new Date(a.scheduled_start).toLocaleString(localeForDates(), { dateStyle: "medium", timeStyle: "short" })}
      </option>
    `).join("");
  }

  async function loadRoster(appointmentId) {
    if (!appointmentId) return;
    rosterSection.style.display = "block";
    await checkLeaveWarning(appointmentId);

    const { data, error } = await supabaseClient
      .from("attendance")
      .select("id, status, make_up_status, made_up_appointment_id, student_id, students(contacts(name))")
      .eq("appointment_id", appointmentId);
    if (error) { alert("Load failed: " + error.message); return; }

    if (!data.length) {
      rosterRows.innerHTML = `<tr><td colspan="3" class="empty">${t("attendance.empty_roster")}</td></tr>`;
      return;
    }
    rosterRows.innerHTML = data.map(row => `
      <tr data-row-id="${row.id}">
        <td>${row.students?.contacts?.name ?? row.student_id}</td>
        <td>
          <select data-field="status" data-attendance-id="${row.id}">
            <option value="" ${!row.status ? "selected" : ""} data-i18n="attstatus.unset">—</option>
            <option value="attended" ${row.status === "attended" ? "selected" : ""} data-i18n="attstatus.attended">Attended</option>
            <option value="leave" ${row.status === "leave" ? "selected" : ""} data-i18n="attstatus.leave">Leave</option>
            <option value="no_show" ${row.status === "no_show" ? "selected" : ""} data-i18n="attstatus.no_show">No-show</option>
          </select>
        </td>
        <td class="makeup-cell" style="${row.status === "leave" ? "" : "display:none;"}">
          <select data-field="make_up_status" data-attendance-id="${row.id}" style="margin-bottom:4px;">
            <option value="pending" ${row.make_up_status === "pending" ? "selected" : ""} data-i18n="makeup.pending">Pending</option>
            <option value="made_up" ${row.make_up_status === "made_up" ? "selected" : ""} data-i18n="makeup.made_up">Made up</option>
            <option value="deferred_to_next_package" ${row.make_up_status === "deferred_to_next_package" ? "selected" : ""} data-i18n="makeup.deferred_to_next_package">Deferred to next package</option>
          </select>
          <select data-field="made_up_appointment_id" data-attendance-id="${row.id}" data-student-id="${row.student_id}" style="${row.make_up_status === "made_up" ? "" : "display:none;"}">
            <option value="">—</option>
            ${makeupOptionsHtml(appointmentId, row.made_up_appointment_id)}
          </select>
        </td>
      </tr>
    `).join("");
    applyI18n();

    rosterRows.querySelectorAll('select[data-field="status"]').forEach(sel => {
      sel.addEventListener("change", async () => {
        const status = sel.value || null;
        const { error } = await supabaseClient
          .from("attendance")
          .update({ status, marked_at: new Date().toISOString() })
          .eq("id", sel.dataset.attendanceId);
        if (error) { alert("Update failed: " + error.message); return; }
        await loadRoster(appointmentId);
      });
    });

    rosterRows.querySelectorAll('select[data-field="make_up_status"]').forEach(sel => {
      sel.addEventListener("change", async () => {
        const make_up_status = sel.value;
        const payload = { make_up_status };
        if (make_up_status !== "made_up") payload.made_up_appointment_id = null;
        const { error } = await supabaseClient
          .from("attendance")
          .update(payload)
          .eq("id", sel.dataset.attendanceId);
        if (error) { alert("Update failed: " + error.message); return; }
        await loadRoster(appointmentId);
      });
    });

    rosterRows.querySelectorAll('select[data-field="made_up_appointment_id"]').forEach(sel => {
      sel.addEventListener("change", async () => {
        const targetAppointmentId = sel.value || null;
        const { error } = await supabaseClient
          .from("attendance")
          .update({ made_up_appointment_id: targetAppointmentId })
          .eq("id", sel.dataset.attendanceId);
        if (error) { alert("Update failed: " + error.message); return; }

        // Also put the student on the other session's roster as attended —
        // saves having to separately open that session and add them by hand.
        if (targetAppointmentId) {
          const { data: existing } = await supabaseClient
            .from("attendance")
            .select("id")
            .eq("appointment_id", targetAppointmentId)
            .eq("student_id", sel.dataset.studentId)
            .maybeSingle();
          if (existing) {
            await supabaseClient
              .from("attendance")
              .update({ status: "attended", marked_at: new Date().toISOString() })
              .eq("id", existing.id);
          } else {
            await supabaseClient
              .from("attendance")
              .insert({
                appointment_id: targetAppointmentId,
                student_id: sel.dataset.studentId,
                status: "attended",
                marked_at: new Date().toISOString(),
              });
          }
        }
      });
    });
  }

  apptSelect.addEventListener("change", () => loadRoster(apptSelect.value));

  document.getElementById("add-student-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const appointmentId = apptSelect.value;
    const studentId = studentSelect.value;
    if (!appointmentId || !studentId) return;
    const { error } = await supabaseClient
      .from("attendance")
      .insert({ appointment_id: appointmentId, student_id: studentId });
    if (error) { alert("Add failed (maybe already on roster): " + error.message); return; }
    await loadRoster(appointmentId);
  });

  await loadStudents();
  await loadAppointments();
})();
</script>
</body>
</html>
