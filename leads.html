<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Leads</title>
<link rel="stylesheet" href="shared.css" />
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: start; }
  .col-head { font-weight: 600; font-size: 13px; color: #6b5c4f; margin-bottom: 8px; }
  .lead-card { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-size: 13px; }
  .lead-card .name { font-weight: 600; }
  .lead-card .meta { color: #8a8074; font-size: 12px; margin-top: 2px; }
  .lead-card select, .lead-card input { width: 100%; margin-top: 6px; font-size: 12px; padding: 4px 6px; }
  .consultation-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .consult-time-label { font-size: 11px; white-space: nowrap; }
  .consultation-row input.consult-time-input { width: auto; flex: 1 1 auto; min-width: 150px; margin-top: 0; font-size: 11px; padding: 3px 4px; }
  .cancel-consultation-btn {
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid #d9a3a3;
    border-radius: 5px;
    background: #fdf2f2;
    color: #8a2e2e;
    cursor: pointer;
  }
  .cancel-consultation-btn:hover { background: #fbe4e4; }
  .delete-lead-btn { font-size: 11px; margin-top: 8px; color: #8a2e2e; }
  @media (max-width: 800px) { #board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="logo.png" alt="" class="brand-logo">Violin Studio</span>
  <a href="index.html" data-i18n="nav.schedule">Schedule</a>
  <a href="availability.html" data-i18n="nav.availability">Availability</a>
  <a href="leads.html" class="active" data-i18n="nav.leads">Leads</a>
  <a href="packages.html" data-i18n="nav.packages">Packages</a>
  <a href="private.html" data-i18n="nav.private">Private Students</a>
  <a href="receipt.html" data-i18n="nav.receipt">Receipt</a>
  <span class="spacer"></span>
  <div class="settings-wrap">
    <button id="settings-btn" title="Settings">⚙️</button>
    <div id="settings-menu" class="settings-menu" style="display:none;">
      <button id="settings-lang-toggle" data-lang-toggle>中文</button>
      <hr />
      <button id="settings-wipe-btn" class="danger" data-i18n="settings.wipe_all_data">Delete ALL website data</button>
    </div>
  </div>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main style="max-width:1200px;">
  <div class="card">
    <h1 style="margin:0 0 10px;" data-i18n="schedule.followup_title">Needs Follow-up</h1>
    <table>
      <thead><tr>
        <th data-i18n="lead.name">Name</th>
        <th data-i18n="lead.phone">WhatsApp number</th>
        <th data-i18n="schedule.followup_col_status">Status</th>
      </tr></thead>
      <tbody id="followup-rows"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h1 style="margin:0;" data-i18n="leads.title">Leads pipeline</h1>
      <button class="primary" id="new-lead-btn" data-i18n="leads.new">+ New lead</button>
    </div>
    <div id="board"></div>
  </div>
</main>

<dialog id="lead-dialog" style="border:none; border-radius:10px; padding:0; width:340px;">
  <form id="lead-form" class="card" style="margin:0; box-shadow:none;">
    <h1 data-i18n="dialog.new_lead">New lead</h1>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <label><span data-i18n="lead.name">Name</span> <input type="text" id="lead-name" required /></label>
      <label><span data-i18n="lead.phone">WhatsApp number</span> <input type="text" id="lead-phone" data-i18n-placeholder="lead.phone_placeholder" placeholder="+852 9123 4567" /></label>
      <label><span data-i18n="lead.social_media_name">Social media name</span> <input type="text" id="lead-social" /></label>
      <label><span data-i18n="lead.level">Level</span> <input type="text" id="lead-level" data-i18n-placeholder="lead.level_placeholder" placeholder="e.g. Beginner / Grade 3" /></label>
      <label><span data-i18n="lead.age">Age</span> <input type="text" id="lead-age" data-i18n-placeholder="lead.age_placeholder" placeholder="e.g. 6, or 4.5 (K2)" /></label>
      <label><span data-i18n="lead.source">Source</span>
        <select id="lead-source">
          <option value="facebook_ad" data-i18n="source.facebook_ad">Facebook ad</option>
          <option value="whatsapp_direct" data-i18n="source.whatsapp_direct">WhatsApp direct</option>
          <option value="referral" data-i18n="source.referral">Referral</option>
          <option value="existing_student" data-i18n="source.existing_student">Existing student</option>
          <option value="rednote" data-i18n="source.rednote">Rednote (小紅書)</option>
          <option value="instagram" data-i18n="source.instagram">Instagram</option>
        </select>
      </label>
      <label><span data-i18n="lead.preferred_times">Preferred times</span> <input type="text" id="lead-preferred-times" data-i18n-placeholder="lead.preferred_times_placeholder" placeholder="e.g. Sat morning, Fri after 5pm" /></label>
      <label><span data-i18n="lead.consultation_time">Consultation time</span> <input type="datetime-local" id="lead-consultation-time" /></label>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="link" id="lead-cancel-btn" data-i18n="dialog.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="dialog.save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  initSettingsMenu();
  window.onLangChange = () => { loadFollowUps(); loadBoard(); };

  const STATUSES = ["inquired", "consultation_booked", "attended", "converted", "lost"];

  // datetime-local inputs need "YYYY-MM-DDTHH:mm" in the *local* timezone —
  // building it from the local getters (not toISOString, which is UTC)
  // keeps the value shown matching what the clock on the wall would say.
  function toDatetimeLocalValue(isoString) {
    const d = new Date(isoString);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  async function loadFollowUps() {
    const tbody = document.getElementById("followup-rows");
    const { data, error } = await supabaseClient
      .from("leads")
      .select("id, status, contacts(name, whatsapp_number)")
      .in("status", ["inquired", "consultation_booked", "attended"])
      .order("updated_at", { ascending: false });
    if (error) { tbody.innerHTML = `<tr><td colspan="3" class="empty">Error: ${error.message}</td></tr>`; return; }
    if (!data.length) { tbody.innerHTML = `<tr><td colspan="3" class="empty">${t("schedule.followup_empty")}</td></tr>`; return; }
    tbody.innerHTML = data.map(l => `
      <tr>
        <td>${l.contacts?.name ?? ""}</td>
        <td>${l.contacts?.whatsapp_number ?? ""}</td>
        <td><span class="status-pill status-confirmed">${t("leadstatus." + l.status)}</span></td>
      </tr>
    `).join("");
  }

  async function loadBoard() {
    const { data, error } = await supabaseClient
      .from("leads")
      .select("id, status, created_at, lost_reason, preferred_times, consultation_appointment_id, contacts(name, whatsapp_number, source, level, age, social_media_name), appointments!leads_consultation_appointment_fk(scheduled_start, status)")
      .order("created_at", { ascending: false });

    const board = document.getElementById("board");
    board.innerHTML = "";
    if (error) {
      board.innerHTML = `<p class="empty">Error: ${error.message}</p>`;
      return;
    }

    STATUSES.forEach(status => {
      const col = document.createElement("div");
      const head = document.createElement("div");
      head.className = "col-head";
      const leadsInCol = data.filter(l => l.status === status);
      head.textContent = `${t("leadstatus." + status)} (${leadsInCol.length})`;
      col.appendChild(head);

      if (!leadsInCol.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.style.fontSize = "12px";
        empty.textContent = "—";
        col.appendChild(empty);
      }

      leadsInCol.forEach(lead => {
        const c = lead.contacts;
        const metaParts = [];
        if (c?.level) metaParts.push(c.level);
        if (c?.age) metaParts.push(c.age);
        if (c?.social_media_name) metaParts.push(c.social_media_name);

        const card = document.createElement("div");
        card.className = "lead-card";
        card.innerHTML = `
          <div class="name">${c?.name ?? "(no name)"}</div>
          <div class="meta">${c?.whatsapp_number ?? ""}</div>
          ${metaParts.length ? `<div class="meta">${metaParts.join(" · ")}</div>` : ""}
          <div class="meta">${c?.source ? t("source." + c.source) : ""}</div>
        `;

        // Only shown while there's still a live, upcoming booking to act
        // on — not once it's cancelled (appointment row stays around for
        // history, lead just no longer points at it) or already attended
        // (marking "attended" also marks the appointment "completed", so
        // there's nothing left to cancel).
        const appt = lead.appointments;
        if (lead.consultation_appointment_id && appt && appt.status !== "cancelled" && status !== "attended") {
          const consultRow = document.createElement("div");
          consultRow.className = "meta consultation-row";
          const timeLabel = document.createElement("span");
          timeLabel.className = "consult-time-label";
          timeLabel.textContent = t("lead.consultation_time") + ":";
          consultRow.appendChild(timeLabel);
          const timeInput = document.createElement("input");
          timeInput.type = "datetime-local";
          timeInput.className = "consult-time-input";
          timeInput.value = toDatetimeLocalValue(appt.scheduled_start);
          timeInput.addEventListener("change", async () => {
            if (!timeInput.value) return;
            // Consultations are a fixed 20min, same as when first booked —
            // rescheduling just shifts the whole window to the new start.
            const start = new Date(timeInput.value);
            const end = new Date(start.getTime() + 20 * 60 * 1000);
            const { error } = await supabaseClient
              .from("appointments")
              .update({ scheduled_start: start.toISOString(), scheduled_end: end.toISOString() })
              .eq("id", lead.consultation_appointment_id);
            if (error) { alert("Update failed: " + error.message); return; }
            await loadBoard();
          });
          consultRow.appendChild(timeInput);
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "cancel-consultation-btn";
          cancelBtn.textContent = t("lead.cancel_consultation");
          cancelBtn.addEventListener("click", async () => {
            if (!confirm(t("lead.cancel_consultation_confirm"))) return;
            const { error: apptError } = await supabaseClient
              .from("appointments").update({ status: "cancelled" }).eq("id", lead.consultation_appointment_id);
            if (apptError) { alert("Cancel failed: " + apptError.message); return; }
            const { error: leadError } = await supabaseClient
              .from("leads").update({ consultation_appointment_id: null }).eq("id", lead.id);
            if (leadError) { alert("Update failed: " + leadError.message); return; }
            await loadBoard();
          });
          consultRow.appendChild(cancelBtn);
          card.appendChild(consultRow);
        }

        const select = document.createElement("select");
        STATUSES.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = t("leadstatus." + s);
          if (s === status) opt.selected = true;
          select.appendChild(opt);
        });
        select.addEventListener("change", async () => {
          const { error } = await supabaseClient
            .from("leads")
            .update({ status: select.value, updated_at: new Date().toISOString() })
            .eq("id", lead.id);
          if (error) { alert("Update failed: " + error.message); return; }
          // Marking "attended" also marks their consultation appointment
          // "completed" — that appointments-table update is what the
          // Google Calendar sync webhook actually reacts to (it turns the
          // event grey; see calendar-sync's colorId logic).
          if (select.value === "attended" && lead.consultation_appointment_id) {
            await supabaseClient.from("appointments").update({ status: "completed" }).eq("id", lead.consultation_appointment_id);
          }
          await loadFollowUps();
          await loadBoard();
        });
        card.appendChild(select);

        const preferredTimesInput = document.createElement("input");
        preferredTimesInput.type = "text";
        preferredTimesInput.placeholder = t("lead.preferred_times_placeholder");
        preferredTimesInput.value = lead.preferred_times ?? "";
        preferredTimesInput.addEventListener("change", async () => {
          const { error } = await supabaseClient
            .from("leads")
            .update({ preferred_times: preferredTimesInput.value || null })
            .eq("id", lead.id);
          if (error) alert("Update failed: " + error.message);
        });
        card.appendChild(preferredTimesInput);

        if (status === "lost") {
          const lostReasonInput = document.createElement("input");
          lostReasonInput.type = "text";
          lostReasonInput.placeholder = t("lead.lost_reason_placeholder");
          lostReasonInput.value = lead.lost_reason ?? "";
          lostReasonInput.addEventListener("change", async () => {
            const { error } = await supabaseClient
              .from("leads")
              .update({ lost_reason: lostReasonInput.value || null })
              .eq("id", lead.id);
            if (error) alert("Update failed: " + error.message);
          });
          card.appendChild(lostReasonInput);
        }

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "link delete-lead-btn";
        deleteBtn.textContent = t("lead.delete");
        deleteBtn.addEventListener("click", () => deleteLead(lead));
        card.appendChild(deleteBtn);

        col.appendChild(card);
      });

      board.appendChild(col);
    });
  }

  // Removes the lead from the pipeline only — the underlying contacts row
  // is left alone (not cascaded), since the same contact can also be a
  // students/private-students record; deleting it would silently wipe that
  // person's whole enrollment history too.
  async function deleteLead(lead) {
    if (!confirm(tf("lead.delete_confirm", { name: lead.contacts?.name ?? "" }))) return;

    // appointments.lead_id points back at this row, so deleting it outright
    // would hit that foreign key. Cancel first (status update is what the
    // calendar-sync webhook reacts to — it only fires on INSERT/UPDATE, so
    // a straight delete would leave a stale Google Calendar event behind)
    // then unlink, clearing the way for the lead delete below.
    const { error: apptError } = await supabaseClient
      .from("appointments").update({ status: "cancelled", lead_id: null }).eq("lead_id", lead.id);
    if (apptError) { alert("Delete failed: " + apptError.message); return; }

    const { error } = await supabaseClient.from("leads").delete().eq("id", lead.id);
    if (error) { alert("Delete failed: " + error.message); return; }
    await loadFollowUps();
    await loadBoard();
  }

  const dialog = document.getElementById("lead-dialog");
  document.getElementById("new-lead-btn").addEventListener("click", () => {
    document.getElementById("lead-form").reset();
    dialog.showModal();
  });
  document.getElementById("lead-cancel-btn").addEventListener("click", () => dialog.close());

  document.getElementById("lead-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("lead-name").value;
    const whatsapp_number = document.getElementById("lead-phone").value || null;
    const social_media_name = document.getElementById("lead-social").value || null;
    const level = document.getElementById("lead-level").value || null;
    const age = document.getElementById("lead-age").value || null;
    const source = document.getElementById("lead-source").value;
    const preferred_times = document.getElementById("lead-preferred-times").value || null;
    const consultationTimeStr = document.getElementById("lead-consultation-time").value;

    const { data: contact, error: contactError } = await supabaseClient
      .from("contacts")
      .insert({ name, whatsapp_number, social_media_name, level, age, source })
      .select()
      .single();
    if (contactError) { alert("Save failed: " + contactError.message); return; }

    const { data: lead, error: leadError } = await supabaseClient
      .from("leads")
      .insert({ contact_id: contact.id, status: consultationTimeStr ? "consultation_booked" : "inquired", preferred_times })
      .select().single();
    if (leadError) { alert("Save failed: " + leadError.message); return; }

    // A consultation time books an actual appointment — this is what
    // actually puts it on the shared Google Calendar (a database webhook on
    // `appointments` INSERT/UPDATE syncs there automatically), not anything
    // this page does directly.
    if (consultationTimeStr) {
      const start = new Date(consultationTimeStr);
      const end = new Date(start.getTime() + 20 * 60 * 1000); // consultations default to 20min, same as the Schedule page
      const { data: appt, error: apptError } = await supabaseClient
        .from("appointments")
        .insert({
          type: "consultation", lead_id: lead.id,
          scheduled_start: start.toISOString(), scheduled_end: end.toISOString(),
          status: "confirmed", notes: name,
        })
        .select().single();
      if (apptError) { alert("Lead saved, but couldn't book the consultation: " + apptError.message); }
      else {
        await supabaseClient.from("leads").update({ consultation_appointment_id: appt.id }).eq("id", lead.id);
      }
    }

    dialog.close();
    await loadFollowUps();
    await loadBoard();
  });

  await loadFollowUps();
  await loadBoard();
})();
</script>
</body>
</html>
