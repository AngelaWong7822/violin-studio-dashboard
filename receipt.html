<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Receipt</title>
<link rel="stylesheet" href="shared.css" />
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
  /* Scoped to this page only — warmer than shared.css's default body tone,
     so the white receipt paper reads as a physical sheet sitting on a desk. */
  body { background: #f4f1ea; }

  #receipt-sheet {
    background: #fff;
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 40px;
    font-family: Georgia, "Times New Roman", serif;
    color: #2a2420;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    border-radius: 4px;
  }
  #receipt-sheet .logo-row { text-align: center; margin-bottom: 2px; }
  #receipt-sheet .logo-row img { height: 64px; }
  #receipt-sheet .studio-title { text-align: center; letter-spacing: 5px; font-size: 15px; margin: 2px 0 20px; }
  .receipt-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 16px; padding: 12px 16px; background: #faf8f4; border: 1px solid #ede6d8; border-radius: 4px; }
  .receipt-meta label { font-size: 10px; letter-spacing: 1.5px; color: #8a6314; display: block; margin-bottom: 4px; text-transform: uppercase; }
  .receipt-meta input { border: none; border-bottom: 1px solid #ddd4c8; font-family: inherit; font-size: 13px; padding: 2px 0; background: transparent; }
  .receipt-meta .issued-to input { width: 200px; }
  .receipt-meta .date-field { text-align: right; }
  .receipt-meta .date-field input { width: 120px; text-align: right; }

  #item-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; margin-bottom: 4px; }
  /* Background on the row (not just each th) so the gold band always fills
     the table's full width even when the trailing "remove item" column is
     hidden/shrunk for print — a cell's own background only covers its own
     (possibly zero-width) box, but the row's shows through underneath it
     regardless, so there's no gap no matter how that column ends up sized. */
  #item-table thead tr { background: #e2d6bb; }
  #item-table thead th { background: #e2d6bb; text-align: center; padding: 7px 8px; font-size: 10px; letter-spacing: 1px; color: #4a4038; }
  #item-table thead th.desc { text-align: left; }
  #item-table col.col-desc { width: auto; }
  #item-table col.col-price, #item-table col.col-qty, #item-table col.col-total { width: 62px; }
  #item-table col.col-actions { width: 20px; }
  #item-table tbody td { padding: 8px; border-bottom: 1px solid #d9d0c3; vertical-align: top; }
  #item-table tbody input { border: none; background: transparent; font-family: inherit; font-size: 12px; width: 100%; padding: 2px 0; text-align: center; }
  #item-table tbody textarea.item-desc { border: none; background: transparent; font-family: inherit; font-weight: 600; font-size: 12px; width: 100%; padding: 2px 0; resize: none; overflow: hidden; line-height: 1.4; display: block; word-break: break-word; }
  /* Screen-only placeholder for the print-safe mirror below — swapped in
     via @media print, where <textarea> printing can't be trusted. */
  .item-desc-print { display: none; line-height: 1.4; word-break: break-word; }
  #item-table .num-cell { text-align: center; }
  #item-table .row-total { text-align: center; white-space: nowrap; }
  #item-table .remove-item-btn { border: none; background: transparent; color: #b0a89c; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
  #item-table .remove-item-btn:hover { color: #8a2e2e; }

  .item-schedule { margin-top: 6px; font-weight: normal; }
  .item-schedule .schedule-title { font-size: 10px; letter-spacing: 1px; color: #8a6314; text-transform: uppercase; margin-bottom: 3px; }
  .item-schedule .schedule-line { font-size: 12px; line-height: 1.6; word-break: break-word; }
  .item-schedule .schedule-line .struck { text-decoration: line-through; color: #a89b8a; }

  #add-item-btn, #add-violin-item-btn, #add-deposit-refund-btn, #add-makeup-conversion-btn { font-size: 12px; margin: 8px 12px 16px 0; }


  .total-row { display: flex; justify-content: flex-end; background: #e2d6bb; padding: 8px 14px; margin-bottom: 24px; }
  .total-row .total-label { font-size: 11px; letter-spacing: 2px; color: #4a4038; margin-right: 20px; }
  .total-row .total-value { font-weight: 700; font-size: 14px; }

  .receipt-footer { display: flex; justify-content: space-between; align-items: flex-end; }
  .receipt-footer .studio-info { font-size: 12px; line-height: 1.7; }
  .receipt-footer .studio-info .studio-name { font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
  .receipt-footer .signature-block { text-align: center; }
  .receipt-footer .signature-block img.stamp-img { height: 70px; display: block; margin: 0 auto 6px; }
  .receipt-footer .signature-block img.signature-img { height: 44px; display: block; margin: 0 auto; }
  .receipt-footer .signature-block .sig-line { width: 130px; border-top: 1px solid #4a4038; margin-top: 4px; padding-top: 4px; font-size: 11px; letter-spacing: 1px; color: #6b5c4f; }

  /* shared.css gives every .card overflow-x:auto so wide data tables can
     scroll instead of being crushed on mobile — but setting overflow-x
     alone makes the browser force overflow-y to "auto" too, which clips
     the student combo dropdown below (it's an absolutely-positioned child
     that intentionally extends past the card's own bottom edge). This card
     has no wide table, so it doesn't need the scroll behavior anyway. */
  #receipt-controls {
    max-width: 560px;
    margin: 0 auto 4px;
    padding: 14px 16px;
    overflow: visible;
    background: #fff;
    border: 1px solid #ede6d8;
    border-radius: 4px 4px 0 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  #receipt-controls .control-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  #receipt-controls label { font-size: 11px; display: block; margin-bottom: 3px; color: #18181b; letter-spacing: .5px; }
  #receipt-controls select { min-width: 200px; border-color: #d9d0c3; }
  #receipt-controls input:focus, #receipt-controls select:focus, #receipt-controls .combo-display:focus {
    outline: none;
    border-color: #8a6314;
    box-shadow: 0 0 0 2px rgba(138, 99, 20, 0.15);
  }
  #receipt-controls button.primary {
    padding: 8px 20px;
    background: #18181b;
    border-color: #18181b;
    color: #fff;
    font-weight: 600;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(24, 24, 27, 0.25);
  }
  #receipt-controls button.primary:hover { background: #000; border-color: #000; }
  /* A visual seam, not a real gap — the paper "grows" out of the control
     bar above it rather than floating separately. */
  #receipt-sheet { margin-top: 0; border-radius: 0 0 4px 4px; }

  /* Searchable combobox: a text field that opens a panel with its own
     search box at the top and a scrollable option list below, instead of
     relying on the browser's native (unsearchable) <select> dropdown. */
  .combo { position: relative; min-width: 200px; }
  .combo-display { width: 100%; box-sizing: border-box; cursor: pointer; background: #fff; }
  .combo-panel { position: absolute; top: 100%; left: 0; right: 0; z-index: 20; background: #fff; border: 1px solid #d9d0c3; border-radius: 6px; margin-top: 2px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .combo-panel .combo-search { padding: 6px; border-bottom: 1px solid #eee; }
  .combo-panel .combo-search input { width: 100%; box-sizing: border-box; }
  .combo-options { max-height: 220px; overflow-y: auto; }
  .combo-option { padding: 7px 10px; cursor: pointer; font-size: 13px; }
  .combo-option:hover, .combo-option.active { background: #f5f2ec; }
  .combo-empty { padding: 7px 10px; font-size: 13px; color: #8a8074; }

  /* "screen and" (not just a bare max-width) keeps this from ever applying
     during print — iOS Safari in particular renders "print" using the
     phone's own screen width, so a bare @media (max-width:600px) stayed
     active there too, fighting the @media print block below for the same
     properties. Scoping to screen media removes that conflict at the
     source, instead of restating every affected property back to its
     desktop value inside @media print to win the fight one by one. */
  @media screen and (max-width: 600px) {
    #receipt-sheet { padding: 20px 16px; }
    /* ISSUED TO / DATE stack instead of sitting side by side, which left
       almost no room for either field's input on a phone-width screen. */
    .receipt-meta { flex-direction: column; align-items: stretch; gap: 8px; }
    .receipt-meta .date-field { text-align: left; }
    .receipt-meta .issued-to input, .receipt-meta .date-field input { width: 100%; box-sizing: border-box; }

    /* The fixed per-column widths below are sized for desktop; on a narrow
       screen they'd leave almost nothing for DESCRIPTION, so everything
       shrinks together instead. */
    #item-table { font-size: 10px; }
    #item-table thead th { padding: 5px 4px; font-size: 8px; }
    #item-table col.col-price, #item-table col.col-qty, #item-table col.col-total { width: 40px; }
    #item-table col.col-actions { width: 16px; }
    #item-table tbody td { padding: 5px 4px; }
    #item-table tbody input, #item-table tbody textarea.item-desc { font-size: 10px; }
    .item-schedule .schedule-line { font-size: 10px; }

    /* Fields default to a 200px min-width, sized for desktop rows — on a
       phone that alone is most of the available width, so each field takes
       its own full-width row instead of fighting the others for space. */
    #receipt-controls .control-row { flex-direction: column; align-items: stretch; }
    #receipt-controls .field-label-wrap, #receipt-controls select, #receipt-controls .combo { min-width: 0; width: 100%; }
    #receipt-controls button.primary { width: 100%; }
  }

  @media print {
    /* Chrome/most browsers skip printing background colors by default —
       without this the table header band and TOTAL row print white. */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    /* A zero page margin leaves no room for the browser's own header
       (date/title) and footer (URL/page number), so they don't print;
       #receipt-sheet's own padding below replaces that lost margin.
       Explicit A4 sizing keeps the physical page consistent regardless of
       whatever default paper size a given device/OS print driver would
       otherwise pick. */
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    header.topnav, #receipt-controls, .no-print { display: none !important; }
    /* This manual Ctrl+P fallback only ever prints the receipt sheet — the
       terms page is generated purely inside the "Save as PDF" flow now
       (see the native PDF section below), not from any on-screen element. */
    #receipt-sheet { box-shadow: none; padding: 36px 42px; max-width: none; }
    /* Both min-height:100vh and position:fixed were tried to pin this to
       the bottom of the printed page, but print-engine behavior for both
       is inconsistent across browsers — 100vh measures against the
       on-screen viewport in some, and position:fixed's coordinate origin
       during pagination isn't the physical page in others (iOS Safari
       rendered it floating mid-page, overlapping the item table). Plain
       document flow is the one thing every engine agrees on. */
    .receipt-footer { margin-top: 40px; }
    /* table-layout:fixed still reserves the "remove item" column's width
       even once its th/td are hidden above — without this the header row's
       gold band falls short of the TOTAL row's, which has no such column. */
    #item-table col.col-actions { width: 0; }

    /* Belt-and-suspenders: the mobile breakpoint above is now scoped to
       "screen" so it can't apply here at all, but restating the desktop
       values explicitly too costs nothing and covers any print engine
       that doesn't honor that scoping correctly. */
    .receipt-meta { flex-direction: row; align-items: flex-start; gap: 16px; }
    .receipt-meta .date-field { text-align: right; }
    .receipt-meta .issued-to input { width: 200px; }
    .receipt-meta .date-field input { width: 120px; }
    #item-table { font-size: 12px; }
    #item-table thead th { padding: 7px 8px; font-size: 10px; }
    #item-table col.col-price, #item-table col.col-qty, #item-table col.col-total { width: 62px; }
    #item-table tbody td { padding: 8px; }
    #item-table tbody input, #item-table tbody textarea.item-desc { font-size: 12px; }
    .item-schedule .schedule-line { font-size: 12px; }

    /* <textarea> print rendering can't be trusted across browsers (see the
       addItemRow comment) — print the plain mirror div instead. */
    #item-table tbody textarea.item-desc { display: none; }
    .item-desc-print { display: block; font-weight: 600; font-size: 12px; line-height: 1.4; white-space: pre-wrap; }
  }
</style>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="logo.png" alt="" class="brand-logo">Violin Studio</span>
  <a href="index.html" data-i18n="nav.schedule">Schedule</a>
  <a href="leads.html" data-i18n="nav.leads">Leads</a>
  <a href="packages.html" data-i18n="nav.packages">Packages</a>
  <a href="private.html" data-i18n="nav.private">Private Students</a>
  <a href="receipt.html" class="active" data-i18n="nav.receipt">Receipt</a>
  <a href="accounting.html" data-i18n="nav.accounting">Accounting</a>
  <span class="spacer"></span>
  <div class="settings-wrap">
    <button id="settings-btn" title="Settings">⚙️</button>
    <div id="settings-menu" class="settings-menu" style="display:none;">
      <button id="settings-lang-toggle" data-lang-toggle>中文</button>
      <button id="settings-export-btn" data-i18n="settings.export_data">Export all data (Excel)</button>
    </div>
  </div>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main>
  <div class="card no-print" id="receipt-controls">
    <div class="control-row">
      <div class="field-label-wrap">
        <label for="receipt-student-display"><span data-i18n="receipt.pick_student">Student</span></label>
        <div class="combo" id="receipt-student-combo">
          <input type="text" class="combo-display" id="receipt-student-display" readonly data-i18n-placeholder="receipt.select_student_placeholder" placeholder="Select a student" />
          <div class="combo-panel" id="receipt-student-panel" style="display:none;">
            <div class="combo-search"><input type="text" id="receipt-student-search" data-i18n-placeholder="receipt.search_student_placeholder" placeholder="Search…" /></div>
            <div class="combo-options" id="receipt-student-options"></div>
          </div>
        </div>
        <input type="hidden" id="receipt-student-select" />
      </div>
      <div class="field-label-wrap">
        <label for="receipt-package-select"><span data-i18n="receipt.pick_package">Term</span></label>
        <select id="receipt-package-select" disabled><option value="" data-i18n="receipt.select_package_placeholder">Select a term</option></select>
      </div>
      <button type="button" class="primary" id="save-pdf-btn" data-i18n="receipt.save_pdf">Save as PDF</button>
    </div>
  </div>

  <div id="receipt-sheet">
    <div class="logo-row"><img src="logo.png" alt="" /></div>
    <div class="studio-title">TOM'S VIOLIN STUDIO</div>

    <div class="receipt-meta">
      <div class="issued-to">
        <label>ISSUED TO:</label>
        <input type="text" id="receipt-issued-to" placeholder="Student name" />
      </div>
      <div class="date-field">
        <label>DATE:</label>
        <input type="date" id="receipt-date" />
      </div>
    </div>

    <table id="item-table">
      <colgroup>
        <col class="col-desc" />
        <col class="col-price" />
        <col class="col-qty" />
        <col class="col-total" />
        <col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th class="desc">DESCRIPTION</th>
          <th>UNIT PRICE</th>
          <th>QTY</th>
          <th>TOTAL</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody id="item-rows"></tbody>
    </table>
    <button type="button" class="link no-print" id="add-item-btn" data-i18n="receipt.add_item">+ Add item</button>
    <button type="button" class="link no-print" id="add-violin-item-btn" style="display:none;" data-i18n="receipt.add_violin_item">+ Add violin item</button>
    <button type="button" class="link no-print" id="add-deposit-refund-btn" data-i18n="receipt.add_deposit_refund">− Deduct paid deposit</button>
    <button type="button" class="link no-print" id="add-makeup-conversion-btn" data-i18n="receipt.add_makeup_conversion">+ Add make-up conversion</button>

    <div class="total-row">
      <span class="total-label">TOTAL</span>
      <span class="total-value" id="receipt-total">$0</span>
    </div>

    <div class="receipt-footer">
      <div class="studio-info">
        <div class="studio-name">TOM'S VIOLIN STUDIO</div>
        <div>Contact number: 95179962</div>
        <div>Address: 9A Spark City(Mong Kok),<br />Tong Mi Road 25, Mong Kok</div>
      </div>
      <div class="signature-block">
        <img src="stamp.png" alt="" class="stamp-img" onerror="this.style.display='none'" />
        <img src="signature.png" alt="" class="signature-img" onerror="this.style.display='none'" />
        <div class="sig-line">Signature</div>
      </div>
    </div>
  </div>
</main>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  initSettingsMenu();
  window.onLangChange = applyI18n;

  document.getElementById("receipt-date").value = new Date().toISOString().slice(0, 10);

  // Same "first N real appointments on/after start_date" rule used on the
  // Packages page, so a term's printed schedule always matches what that
  // page shows — holiday closures etc. don't throw the dates off.
  async function getPackageLessonAppointments(classId, startDate, totalLessons) {
    const { data } = await supabaseClient
      .from("appointments").select("id, scheduled_start, rescheduled_from")
      .eq("class_id", classId).gte("scheduled_start", startDate)
      .order("scheduled_start", { ascending: true }).limit(totalLessons);
    return data ?? [];
  }

  function formatDateLabel(iso) {
    return new Date(iso).toLocaleDateString("en-HK", { dateStyle: "medium" });
  }

  // A rescheduled lesson (whole-class move, e.g. a typhoon) shows its
  // original date struck through with an arrow to the date it actually
  // landed on — same convention as the studio's paper receipt template.
  // Structured (not pre-rendered HTML) so both the on-screen row and the
  // native PDF generator can render it their own way from the same data.
  function scheduleLineData(appt) {
    return appt.rescheduled_from
      ? { struckText: formatDateLabel(appt.rescheduled_from), text: formatDateLabel(appt.scheduled_start) }
      : { struckText: null, text: formatDateLabel(appt.scheduled_start) };
  }

  // Same rules the Packages page's Payments tab uses, so a term's price on
  // the receipt always matches what's shown there: a "same-period" leave
  // deducts this package's own per-lesson rate, and any deferred credit
  // landing on this package (from an earlier term's leave) is subtracted too.
  function isDeductible(row) {
    return row.status === "leave" && row.make_up_status === "pending";
  }

  async function getIncomingCreditAmounts(packageIds) {
    const amounts = new Map();
    if (!packageIds.length) return amounts;
    const { data } = await supabaseClient
      .from("attendance").select("deferred_credit_used_in_package_id, deferred_credit_amount").in("deferred_credit_used_in_package_id", packageIds);
    (data ?? []).forEach(r => amounts.set(r.deferred_credit_used_in_package_id, (amounts.get(r.deferred_credit_used_in_package_id) ?? 0) + (r.deferred_credit_amount ?? 0)));
    return amounts;
  }

  function effectivePrice(pkg, lessons) {
    const perLessonPrice = pkg.price / pkg.total_lessons;
    const ownDeduction = lessons.filter(isDeductible).length * perLessonPrice;
    return Math.round(Math.max(0, pkg.price - ownDeduction - (pkg.incomingCreditAmount ?? 0)));
  }

  function autoGrowTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  function addItemRow({ description = "", unitPrice = "", qty = 1, scheduleLines = null } = {}) {
    const tbody = document.getElementById("item-rows");
    const tr = document.createElement("tr");
    const scheduleHtml = scheduleLines && scheduleLines.length
      ? `<div class="item-schedule"><div class="schedule-title">${t("receipt.schedule_title")}</div>${scheduleLines.map(l =>
          l.struckText
            ? `<div class="schedule-line"><span class="struck">${l.struckText}</span> → ${l.text}</div>`
            : `<div class="schedule-line">${l.text}</div>`
        ).join("")}</div>`
      : "";
    tr.innerHTML = `
      <td><textarea class="item-desc" rows="1"></textarea><div class="item-desc-print"></div>${scheduleHtml}</td>
      <td class="num-cell"><input type="number" class="item-price" value="${unitPrice}" step="0.01" /></td>
      <td class="qty-cell"><input type="number" class="item-qty" value="${qty}" min="0" step="1" /></td>
      <td class="row-total">$0</td>
      <td class="no-print"><button type="button" class="remove-item-btn" title="${t("receipt.remove_item")}">×</button></td>
    `;
    // Kept as a plain JS property (not re-derived from the rendered HTML
    // above) so the native PDF generator has the same structured data to
    // draw from directly, instead of having to parse it back out of the
    // DOM — there's no on-screen way to edit the schedule once added, so
    // this never needs to be kept in sync with anything else.
    tr._scheduleLines = scheduleLines || [];
    tbody.appendChild(tr);
    const descEl = tr.querySelector(".item-desc");
    const descPrintEl = tr.querySelector(".item-desc-print");
    // <textarea> printing is unreliable across browsers (iOS Safari in
    // particular sometimes only prints whatever fit before it was last
    // focused, not the full value) — a plain element mirroring the same
    // text is what actually gets shown on the printed page.
    const syncPrintText = () => { descPrintEl.textContent = descEl.value; };
    descEl.value = description;
    syncPrintText();
    descEl.addEventListener("input", () => { autoGrowTextarea(descEl); syncPrintText(); });
    autoGrowTextarea(descEl);
    tr.querySelectorAll("input").forEach(el => el.addEventListener("input", recalcTotals));
    tr.querySelector(".remove-item-btn").addEventListener("click", () => { tr.remove(); recalcTotals(); });
    recalcTotals();
  }

  function recalcTotals() {
    let grandTotal = 0;
    document.querySelectorAll("#item-rows tr").forEach(tr => {
      const price = parseFloat(tr.querySelector(".item-price").value) || 0;
      const qty = parseFloat(tr.querySelector(".item-qty").value) || 0;
      const rowTotal = price * qty;
      tr.querySelector(".row-total").textContent = `$${rowTotal.toLocaleString()}`;
      grandTotal += rowTotal;
    });
    document.getElementById("receipt-total").textContent = `$${grandTotal.toLocaleString()}`;
  }

  document.getElementById("add-item-btn").addEventListener("click", () => addItemRow());

  // Not a per-term charge — the button only appears when the student's own
  // profile (Packages page) says they need a violin, and stays a manual

  const VIOLIN_ITEMS = {

  let currentViolinStatus = "not_needed";
  // Read by the native PDF generator to decide whether to append the terms
  // page — no on-screen element backs this any more (see buildTermsPdfPage
  // below), just this plain flag.
  let showTermsPage = false;

    if (currentViolinStatus === "buy") {

  // Group class enrollment collects a $200 deposit upfront (to help make
  // sure a student actually shows up) — this button just adds a negative
  // line so the current total reflects the $200 already in hand from an
  // earlier receipt; it doesn't touch that earlier receipt itself. Applies
  // to every student, not just violin rentals, so it's always visible.
  document.getElementById("add-deposit-refund-btn").addEventListener("click", () => {
    addItemRow({ description: "Deposit (Previously Paid)", unitPrice: -200, qty: 1 });

  // Same idea as the deposit shortcut — a standing paid service (turning

  // ---------- Student + term pickers (auto-fill convenience) ----------
  // Custom searchable combobox — a native <select> can't put a search box
  // inside its own dropdown, so this is a text "display" field that opens a
  // panel containing a search input (filters the option list live, no
  // re-query) and the clickable option list itself.
  const studentSelect = document.getElementById("receipt-student-select"); // hidden input, holds the chosen student id
  const studentDisplay = document.getElementById("receipt-student-display");
  const studentCombo = document.getElementById("receipt-student-combo");
  const studentPanel = document.getElementById("receipt-student-panel");
  const studentSearch = document.getElementById("receipt-student-search");
  const studentOptionsEl = document.getElementById("receipt-student-options");
  const packageSelect = document.getElementById("receipt-package-select");
  let studentsCache = [];

  function renderStudentOptions() {
    const searchText = studentSearch.value.trim().toLowerCase();
    const filtered = searchText
      ? studentsCache.filter(s => (s.contacts?.name ?? "").toLowerCase().includes(searchText))
      : studentsCache;
    studentOptionsEl.innerHTML = filtered.length
      ? filtered.map(s => `<div class="combo-option" data-id="${s.id}">${s.contacts?.name ?? ""}</div>`).join("")
      : `<div class="combo-empty">${t("receipt.no_students_found")}</div>`;
    studentOptionsEl.querySelectorAll(".combo-option").forEach(opt => {
      opt.addEventListener("click", () => selectStudent(opt.dataset.id));
    });
  }
  studentSearch.addEventListener("input", renderStudentOptions);

  function openStudentPanel() {
    studentPanel.style.display = "";
    studentSearch.value = "";
    renderStudentOptions();
    studentSearch.focus();
  }
  function closeStudentPanel() {
    studentPanel.style.display = "none";
  }
  studentDisplay.addEventListener("click", () => {
    if (studentPanel.style.display === "none") openStudentPanel(); else closeStudentPanel();
  });
  document.addEventListener("click", (e) => {
    if (!studentCombo.contains(e.target)) closeStudentPanel();
  });

  async function loadStudents() {
    const { data } = await supabaseClient
      .from("students")
      .select("id, contacts(name, violin_status)")
      .eq("active", true)
      .order("created_at", { ascending: false });

    // A student's "current" status is their most recently created package —
    // same rule the Packages page's Students tab uses. Exclude anyone whose
    // latest package was cancelled (i.e. they've quit) from the picker.
    const withActive = await Promise.all((data ?? []).map(async (s) => {
      const { data: pkgs } = await supabaseClient
        .from("packages").select("status")
        .eq("student_id", s.id)
        .order("created_at", { ascending: false }).limit(1);
      const isWithdrawn = pkgs?.[0]?.status === "cancelled";
      return { student: s, isWithdrawn };
    }));
    studentsCache = withActive.filter(r => !r.isWithdrawn).map(r => r.student);
  }

  async function selectStudent(studentId) {
    studentSelect.value = studentId;
    const student = studentsCache.find(s => s.id === studentId);
    studentDisplay.value = student?.contacts?.name ?? "";
    closeStudentPanel();

    packageSelect.innerHTML = `<option value="">${t("receipt.select_package_placeholder")}</option>`;
    packageSelect.disabled = true;
    document.getElementById("receipt-issued-to").value = student?.contacts?.name ?? "";
    currentViolinStatus = student?.contacts?.violin_status ?? "not_needed";
    document.getElementById("add-violin-item-btn").style.display = currentViolinStatus === "not_needed" ? "none" : "";
    // Reset here rather than deciding it from currentViolinStatus alone —
    // it should only appear once "+ Add violin item" is actually clicked
    // (see that handler below), not just because this student's profile
    // says they need to buy one, or every receipt ever printed for them
    // would carry the terms page even when this one has nothing to do
    // with a violin purchase.
    showTermsPage = false;
    if (!studentId) return;

    const { data: pkgs } = await supabaseClient
      .from("packages")
      .select("id, start_date, total_lessons, price, class_id, classes(name, weekly_day_of_week, weekly_start_time, duration_minutes)")
      .eq("student_id", studentId)
      .order("start_date", { ascending: false });
    if (!pkgs || !pkgs.length) return;

    const incomingCreditAmounts = await getIncomingCreditAmounts(pkgs.map(p => p.id));
    await Promise.all(pkgs.map(async (p) => {
      p.incomingCreditAmount = incomingCreditAmounts.get(p.id) ?? 0;
      const appts = await getPackageLessonAppointments(p.class_id, p.start_date, p.total_lessons);
      const apptIds = appts.map(a => a.id);
      let attRows = [];
      if (apptIds.length) {
        const { data } = await supabaseClient
          .from("attendance").select("appointment_id, status, make_up_status")
          .eq("student_id", studentId).in("appointment_id", apptIds);
        attRows = data ?? [];
      }
      const lessons = appts.map(a => {
        const att = attRows.find(r => r.appointment_id === a.id);
        return { status: att?.status ?? null, make_up_status: att?.make_up_status ?? null };
      });
      p.effectivePrice = effectivePrice(p, lessons);
    }));

    // Term numbers count ALL of this student's packages chronologically
    // (earliest = Term 1) — same "第1期/第2期…" convention the Payments tab
    // uses — independent of this dropdown's own most-recent-first order,
    // so two same-named terms in the list are still tellable apart without
    // showing the date/price a student might see over someone's shoulder.
    const chronological = [...pkgs].sort((a, b) => a.start_date.localeCompare(b.start_date));
    const termNumberById = new Map(chronological.map((p, i) => [p.id, i + 1]));

    packageSelect.innerHTML = `<option value="">${t("receipt.select_package_placeholder")}</option>`
      + pkgs.map(p => `<option value="${p.id}">${p.classes?.name ?? ""}（${tf("receipt.term_number", { n: termNumberById.get(p.id) })}）</option>`).join("");
    packageSelect.disabled = false;
    packageSelect.dataset.pkgs = JSON.stringify(pkgs);
  }

  packageSelect.addEventListener("change", async () => {
    const pkgId = packageSelect.value;
    if (!pkgId) return;
    const pkgs = JSON.parse(packageSelect.dataset.pkgs || "[]");
    const pkg = pkgs.find(p => p.id === pkgId);
    if (!pkg) return;

    const appts = await getPackageLessonAppointments(pkg.class_id, pkg.start_date, pkg.total_lessons);
    const scheduleLines = appts.map(scheduleLineData);

    const cls = pkg.classes;
    let description = cls?.name ?? "";
    if (cls?.weekly_day_of_week != null && cls?.weekly_start_time) {
      const start = cls.weekly_start_time.slice(0, 5);
      const end = new Date(new Date(`2000-01-01T${cls.weekly_start_time}`).getTime() + (cls.duration_minutes ?? 60) * 60000)
        .toTimeString().slice(0, 5);
      description += ` (${t("weekday_full." + cls.weekly_day_of_week)} ${start}-${end})`;
    }

    document.getElementById("item-rows").innerHTML = "";
    addItemRow({ description, unitPrice: pkg.effectivePrice, qty: 1, scheduleLines });
  });

  // ---------- Native PDF generation ----------
  // Draws the receipt directly with jsPDF's own text/shape/image APIs
  // instead of screenshotting the on-screen DOM (the old html2pdf.js +
  // html2canvas approach) — that approach ran through whatever browser
  // engine the user's own device happened to have, and iOS Safari kept
  // diverging from the desktop Chrome environment this was built and
  // tested in (text auto-inflation, input-element rendering, viewport-
  // dependent media queries mid-capture...), each one only surfacing once
  // a real phone hit it. Drawing directly with jsPDF never touches the
  // browser's own rendering pipeline at all, so the output is identical
  // regardless of what device or browser generates it.
  const PDF = { PAGE_W: 595.28, PAGE_H: 841.89, MARGIN: 50 };
  PDF.CONTENT_W = PDF.PAGE_W - PDF.MARGIN * 2;
  PDF.COL_PRICE_W = 70;
  PDF.COL_QTY_W = 50;
  PDF.COL_TOTAL_W = 75;
  PDF.COL_DESC_W = PDF.CONTENT_W - PDF.COL_PRICE_W - PDF.COL_QTY_W - PDF.COL_TOTAL_W;
  PDF.COL_DESC_X = PDF.MARGIN;
  PDF.COL_PRICE_X = PDF.COL_DESC_X + PDF.COL_DESC_W;
  PDF.COL_QTY_X = PDF.COL_PRICE_X + PDF.COL_PRICE_W;
  PDF.COL_TOTAL_X = PDF.COL_QTY_X + PDF.COL_QTY_W;
  PDF.BOTTOM_LIMIT = PDF.PAGE_H - 60;

  const PDF_COLORS = {
    text: [42, 36, 32],
    gold: [95, 66, 10],
    headerBg: [226, 214, 187],
    headerText: [38, 32, 26],
    border: [217, 208, 195],
    metaBg: [250, 248, 244],
    metaBorder: [237, 230, 216],
    metaLine: [221, 212, 200],
    sigText: [55, 46, 38],
    struck: [168, 155, 138],
  };

  const TERMS_AND_CONDITIONS_ZH = [
    "所有產品只提供瑕疵品退換服務，其他退換原因均一律不接受。",

    "所有產品必須經過合理保養，例如不得有磨損或損壞，且其狀態必須可讓本公司轉售該產品，才能進行退貨。",
    "未經授權的維修，誤用，碰撞，疏忽，事故，改裝，不正確安裝所造成的貨品問題，撕毀，塗改標貼，防偽，標記等，均不給予7天兌換貨品。",
    "如有任何爭議，本公司Tom's Violin studio將保留最終決定權。",

  const TERMS_AND_CONDITIONS_EN = [

    "Buyer should examine the product thoroughly and the product on one receipt can be exchanged once only.",
    "All product can be exchanged once within 7 days from the date of purchase.",
    "Sold items requested for exchange must be in a good and acceptable resell-able condition.",
    "Any unauthorised alternation made to the sold items are not eligible for 7 days exchange policy.",
    "In case of any dispute, Tom's Violin studio's decision shall be final.",
  ];

  // jsPDF's built-in fonts (Helvetica/Times/etc) have zero Chinese glyph
  // coverage — drawing any CJK text with them silently produces garbage,
  // not an error, which is exactly what happened before this: a student's
  // Chinese name or the app's current language ("chinese schedule label")
  // came out as mojibake. Pinned to a specific commit (not a branch) so
  // the file never changes — jsdelivr serves commit-pinned URLs as
  // max-age=1yr immutable, so after the first PDF ever generated on a
  // given device this is effectively free from browser cache. jsPDF's own
  // embedding subsets the font down to only the glyphs actually used in
  // the document, so the *output* PDF stays small regardless of the
  // ~7MB source font — confirmed directly: a test PDF with a full line of
  // Chinese text still came out under 300KB.
  const CJK_FONT_URL = "https://cdn.jsdelivr.net/gh/google/fonts@352f6b7d9d6cc4fa9e242b931291d31b21a6dc84/ofl/notosanstc/NotoSansTC[wght].ttf";
  const CJK_FONT_NAME = "NotoSansTC";
  let cjkFontLoadPromise = null;
  function loadCjkFontIntoPdf(doc) {
    if (!cjkFontLoadPromise) {
      cjkFontLoadPromise = fetch(CJK_FONT_URL)
        .then(res => res.arrayBuffer())
        .then(buf => {
          const bytes = new Uint8Array(buf);
          let binary = "";
          const chunkSize = 0x8000;
          for (let i = 0; i < bytes.length; i += chunkSize) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
          return btoa(binary);
        });
    }
    return cjkFontLoadPromise.then(base64 => {
      doc.addFileToVFS(`${CJK_FONT_NAME}.ttf`, base64);
      // This is a variable font (one file covers its whole weight range),
      // but PDF viewers don't render variable-font weight axes — jsPDF
      // just embeds its default instance, so "bold" text drawn with it
      // comes out the same visual weight as "normal". A worthwhile
      // trade-off for correct Chinese rendering everywhere rather than
      // chasing down a separate static bold CJK font file too.
      doc.addFont(`${CJK_FONT_NAME}.ttf`, CJK_FONT_NAME, "normal");
      doc.addFont(`${CJK_FONT_NAME}.ttf`, CJK_FONT_NAME, "bold");
    });
  }

  // jsPDF embeds whatever image data it's given as-is — passing the raw
  // PNGs directly (logo.png alone is roughly 950x950) bloated a single
  // receipt to several MB, way too big to send over WhatsApp/email.
  // Re-encoding each one as a JPEG onto a plain white background (all
  // three only ever appear on white anyway, so the lost transparency
  // doesn't show) instead gets a normal-sized PDF back.
  function loadImageAsJpeg(url, quality = 0.85) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        resolve({ dataUrl: canvas.toDataURL("image/jpeg", quality), width: img.naturalWidth, height: img.naturalHeight });
      };
      img.onerror = () => resolve(null);
      img.src = url;
    });
  }

  // jsPDF's text() has no built-in letter-spacing/tracking — this fakes it
  // by drawing one character at a time with a fixed gap, matching the
  // brand's spaced-out header style (e.g. "TOM'S VIOLIN STUDIO").
  function drawTrackedText(doc, text, x, y, { align = "left", spacing = 0 } = {}) {
    if (!spacing) { doc.text(text, x, y, { align }); return; }
    const chars = [...text];
    const widths = chars.map(c => doc.getTextWidth(c));
    const totalW = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
    let cx = x;
    if (align === "center") cx = x - totalW / 2;
    else if (align === "right") cx = x - totalW;
    chars.forEach((c, i) => {
      doc.text(c, cx, y);
      cx += widths[i] + spacing;
    });
  }

  function drawPdfPageHeader(doc, logoImg, y) {
    if (logoImg) {
      const h = 42;
      const w = h * (logoImg.width / logoImg.height);
      doc.addImage(logoImg.dataUrl, "JPEG", PDF.PAGE_W / 2 - w / 2, y, w, h);
      y += h + 10;
    }
    doc.setFont(CJK_FONT_NAME, "normal");
    doc.setFontSize(13);
    doc.setTextColor(...PDF_COLORS.text);
    drawTrackedText(doc, "TOM'S VIOLIN STUDIO", PDF.PAGE_W / 2, y, { align: "center", spacing: 3 });
    return y + 28;
  }

  function drawMetaBox(doc, y, issuedTo, dateText) {
    const boxH = 50, padX = 16, labelY = y + 18, valueY = y + 36;
    doc.setFillColor(...PDF_COLORS.metaBg);
    doc.setDrawColor(...PDF_COLORS.metaBorder);
    doc.roundedRect(PDF.MARGIN, y, PDF.CONTENT_W, boxH, 3, 3, "FD");

    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(8);
    doc.setTextColor(...PDF_COLORS.gold);
    drawTrackedText(doc, "ISSUED TO:", PDF.MARGIN + padX, labelY, { spacing: 1 });
    drawTrackedText(doc, "DATE:", PDF.PAGE_W - PDF.MARGIN - padX, labelY, { align: "right", spacing: 1 });

    doc.setFontSize(13);
    doc.setTextColor(...PDF_COLORS.text);
    doc.text(issuedTo || "", PDF.MARGIN + padX, valueY);
    doc.text(dateText || "", PDF.PAGE_W - PDF.MARGIN - padX, valueY, { align: "right" });

    doc.setDrawColor(...PDF_COLORS.metaLine);
    doc.line(PDF.MARGIN + padX, valueY + 4, PDF.MARGIN + padX + 150, valueY + 4);

    return y + boxH + 24;
  }

  function drawTableHeader(doc, y) {
    const h = 26;
    doc.setFillColor(...PDF_COLORS.headerBg);
    doc.rect(PDF.MARGIN, y, PDF.CONTENT_W, h, "F");
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(9);
    doc.setTextColor(...PDF_COLORS.headerText);
    doc.text("DESCRIPTION", PDF.COL_DESC_X + 8, y + h / 2 + 3);
    doc.text("UNIT PRICE", PDF.COL_PRICE_X + PDF.COL_PRICE_W / 2, y + h / 2 + 3, { align: "center" });
    doc.text("QTY", PDF.COL_QTY_X + PDF.COL_QTY_W / 2, y + h / 2 + 3, { align: "center" });
    doc.text("TOTAL", PDF.COL_TOTAL_X + PDF.COL_TOTAL_W / 2, y + h / 2 + 3, { align: "center" });
    return y + h;
  }

  function collectReceiptItems() {
    return [...document.querySelectorAll("#item-rows tr")].map(tr => {
      const price = parseFloat(tr.querySelector(".item-price").value) || 0;
      const qty = parseFloat(tr.querySelector(".item-qty").value) || 0;
      return {
        description: tr.querySelector(".item-desc").value,
        price, qty, total: price * qty,
        scheduleLines: tr._scheduleLines || [],
      };
    });
  }

  // Measures a row's full height before drawing anything — needed to know
  // whether it still fits on the current page (see buildReceiptPage) before
  // committing to draw it there.
  function measureItemRow(doc, item) {
    const padX = 8;
    const maxW = PDF.COL_DESC_W - padX * 2;
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(11);
    const descLines = doc.splitTextToSize(item.description || "", maxW);
    let h = 10 + descLines.length * 14;

    const scheduleLines = [];
    if (item.scheduleLines.length) {
      h += 14;
      doc.setFont(CJK_FONT_NAME, "normal");
      doc.setFontSize(10);
      item.scheduleLines.forEach(line => {
        if (line.struckText) {
          scheduleLines.push(line);
          h += 13;
        } else {
          const wrapped = doc.splitTextToSize(line.text, maxW);
          scheduleLines.push({ ...line, wrapped });
          h += wrapped.length * 13;
        }
      });
    }
    return { descLines, scheduleLines, height: h + 10 };
  }

  function drawItemRow(doc, y, item, measured) {
    const padX = 8;
    let cy = y + 16;
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(11);
    doc.setTextColor(...PDF_COLORS.text);
    measured.descLines.forEach(line => { doc.text(line, PDF.COL_DESC_X + padX, cy); cy += 14; });

    if (measured.scheduleLines.length) {
      doc.setFont(CJK_FONT_NAME, "bold");
      doc.setFontSize(9);
      doc.setTextColor(...PDF_COLORS.gold);
      // .toUpperCase() is a no-op on Chinese text, so this stays safe for
      // either language — matches the on-screen label's CSS
      // text-transform:uppercase, which obviously doesn't apply here.
      doc.text(t("receipt.schedule_title").toUpperCase(), PDF.COL_DESC_X + padX, cy);
      cy += 14;
      doc.setFontSize(10);
      measured.scheduleLines.forEach(line => {
        if (line.struckText) {
          doc.setTextColor(...PDF_COLORS.struck);
          const struckW = doc.getTextWidth(line.struckText);
          doc.text(line.struckText, PDF.COL_DESC_X + padX, cy);
          doc.setDrawColor(...PDF_COLORS.struck);
          doc.line(PDF.COL_DESC_X + padX, cy - 3, PDF.COL_DESC_X + padX + struckW, cy - 3);
          doc.setTextColor(...PDF_COLORS.text);
          // "->" not "→" — the Unicode arrow isn't in jsPDF's standard
          // font encoding and renders as garbage instead of a visible error.
          doc.text(` -> ${line.text}`, PDF.COL_DESC_X + padX + struckW, cy);
          cy += 13;
        } else {
          doc.setTextColor(...PDF_COLORS.text);
          line.wrapped.forEach(wline => { doc.text(wline, PDF.COL_DESC_X + padX, cy); cy += 13; });
        }
      });
    }

    doc.setFont(CJK_FONT_NAME, "normal");
    doc.setFontSize(11);
    doc.setTextColor(...PDF_COLORS.text);
    const valueY = y + 16;
    doc.text(item.price.toLocaleString(), PDF.COL_PRICE_X + PDF.COL_PRICE_W / 2, valueY, { align: "center" });
    doc.text(String(item.qty), PDF.COL_QTY_X + PDF.COL_QTY_W / 2, valueY, { align: "center" });
    doc.text(`$${item.total.toLocaleString()}`, PDF.COL_TOTAL_X + PDF.COL_TOTAL_W / 2, valueY, { align: "center" });

    doc.setDrawColor(...PDF_COLORS.border);
    doc.line(PDF.MARGIN, y + measured.height, PDF.MARGIN + PDF.CONTENT_W, y + measured.height);
    return y + measured.height;
  }

  function drawTotalRow(doc, y, total) {
    const h = 26;
    doc.setFillColor(...PDF_COLORS.headerBg);
    doc.rect(PDF.MARGIN, y, PDF.CONTENT_W, h, "F");
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(9);
    doc.setTextColor(...PDF_COLORS.headerText);
    doc.text("TOTAL", PDF.COL_TOTAL_X - 16, y + h / 2 + 3, { align: "right" });
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(12);
    doc.setTextColor(...PDF_COLORS.text);
    doc.text(`$${total.toLocaleString()}`, PDF.MARGIN + PDF.CONTENT_W - 8, y + h / 2 + 3, { align: "right" });
    return y + h + 32;
  }

  function drawFooter(doc, y, stampImg, signatureImg) {
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(11);
    doc.setTextColor(...PDF_COLORS.text);
    doc.text("TOM'S VIOLIN STUDIO", PDF.MARGIN, y);
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(10);
    doc.text("Contact number: 95179962", PDF.MARGIN, y + 16);
    doc.text("Address: 9A Spark City(Mong Kok),", PDF.MARGIN, y + 30);
    doc.text("Tong Mi Road 25, Mong Kok", PDF.MARGIN, y + 44);

    const sigCenterX = PDF.PAGE_W - PDF.MARGIN - 65;
    let sigY = y - 14;
    if (stampImg) {
      const h = 60;
      const w = h * (stampImg.width / stampImg.height);
      doc.addImage(stampImg.dataUrl, "JPEG", sigCenterX - w / 2, sigY, w, h);
      sigY += h + 6;
    }
    if (signatureImg) {
      const h = 36;
      const w = h * (signatureImg.width / signatureImg.height);
      doc.addImage(signatureImg.dataUrl, "JPEG", sigCenterX - w / 2, sigY, w, h);
      sigY += h + 6;
    }
    doc.setDrawColor(...PDF_COLORS.headerText);
    doc.line(sigCenterX - 55, sigY, sigCenterX + 55, sigY);
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(9);
    doc.setTextColor(...PDF_COLORS.sigText);
    drawTrackedText(doc, "Signature", sigCenterX, sigY + 12, { align: "center", spacing: 1 });
  }

  function buildReceiptPage(doc, images) {
    let y = 40;
    y = drawPdfPageHeader(doc, images.logo, y);

    const issuedTo = document.getElementById("receipt-issued-to").value;
    const dateValue = document.getElementById("receipt-date").value;
    const dateText = dateValue
      ? new Date(`${dateValue}T00:00:00`).toLocaleDateString("en-HK", { dateStyle: "medium" })
      : "";
    y = drawMetaBox(doc, y, issuedTo, dateText);
    y = drawTableHeader(doc, y);

    const items = collectReceiptItems();
    items.forEach(item => {
      const measured = measureItemRow(doc, item);
      if (y + measured.height > PDF.BOTTOM_LIMIT) {
        doc.addPage();
        y = 40;
        y = drawTableHeader(doc, y);
      }
      y = drawItemRow(doc, y, item, measured);
    });

    const grandTotal = items.reduce((sum, it) => sum + it.total, 0);
    if (y + 26 + 130 > PDF.BOTTOM_LIMIT) {
      doc.addPage();
      y = 40;
    }
    y = drawTotalRow(doc, y, grandTotal);
    drawFooter(doc, y + 20, images.stamp, images.signature);
  }

  function drawTermsList(doc, y, heading, clauses) {
    const numberW = 20;
    if (y + 22 > PDF.BOTTOM_LIMIT) { doc.addPage(); y = 40; }
    doc.setFont(CJK_FONT_NAME, "bold");
    doc.setFontSize(12);
    doc.setTextColor(...PDF_COLORS.text);
    doc.text(heading, PDF.MARGIN, y);
    y += 22;

    doc.setFont(CJK_FONT_NAME, "normal");
    doc.setFontSize(11);
    clauses.forEach((clause, i) => {
      const wrapped = doc.splitTextToSize(clause, PDF.CONTENT_W - numberW);
      const blockH = wrapped.length * 15 + 8;
      if (y + blockH > PDF.BOTTOM_LIMIT) { doc.addPage(); y = 40; }
      doc.text(`${i + 1}.`, PDF.MARGIN, y);
      wrapped.forEach((line, li) => doc.text(line, PDF.MARGIN + numberW, y + li * 15));
      y += blockH;
    });
    return y;
  }

  function buildTermsPage(doc, images) {
    doc.addPage();
    let y = 40;
    y = drawPdfPageHeader(doc, images.logo, y);
    y += 14;

    y = drawTermsList(doc, y, "條款與細則", TERMS_AND_CONDITIONS_ZH);
    y += 14;
    drawTermsList(doc, y, "Terms and Conditions", TERMS_AND_CONDITIONS_EN);
  }

  document.getElementById("save-pdf-btn").addEventListener("click", async () => {
    const btn = document.getElementById("save-pdf-btn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "…";
    try {
      const studentName = document.getElementById("receipt-issued-to").value.trim();
      const filename = `Receipt${studentName ? " - " + studentName : ""}.pdf`;

      const doc = new jspdf.jsPDF({ unit: "pt", format: "a4", orientation: "portrait" });
      const [logo, stamp, signature] = await Promise.all([
        loadImageAsJpeg("logo.png"),
        loadImageAsJpeg("stamp.png"),
        loadImageAsJpeg("signature.png"),
        loadCjkFontIntoPdf(doc),
      ]);

      buildReceiptPage(doc, { logo, stamp, signature });
      if (showTermsPage) buildTermsPage(doc, { logo });

      doc.save(filename);
    } catch (err) {
      showToast("Save failed: " + err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  addItemRow();
  await loadStudents();
})();
</script>
</body>
</html>
