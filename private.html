        await showConfirm(tf("private.book_month_confirm", { n: candidateDates.length, weekday: weekdayLabel, time: c.regular_time }))) {
      const rows = candidateDates.map(start => ({
        type: "lesson", lesson_format: format, student_id: student.id,
        scheduled_start: start.toISOString(),
        scheduled_end: new Date(start.getTime() + durationMin * 60 * 1000).toISOString(),
        status: "confirmed", created_via: "manual_dashboard", price,
      }));
      const { data: inserted, error } = await supabaseClient.from("appointments").insert(rows).select();
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
      const attRows = inserted.map(a => ({ appointment_id: a.id, student_id: student.id }));
      const { error: attError } = await supabaseClient.from("attendance").insert(attRows);
      if (attError) { showToast("Lessons saved, but couldn't create their attendance rows: " + attError.message, "error", 5000); return; }
      showToast(tf("private.book_month_done", { n: inserted.length }));
      changed = true;
    }

    if (mismatched.length) {
      const dateList = mismatched.map(x => `${x.start.getMonth() + 1}/${x.start.getDate()}`).join("、");
      if (await showConfirm(tf("private.book_month_fix_confirm", { dates: dateList, time: c.regular_time }))) {
        for (const { lesson, start } of mismatched) {
          const durMs = lesson.whenEnd ? (new Date(lesson.whenEnd) - new Date(lesson.when)) : durationMin * 60 * 1000;
          const { error } = await supabaseClient.from("appointments").update({
            scheduled_start: start.toISOString(),
            scheduled_end: new Date(start.getTime() + durMs).toISOString(),
          }).eq("id", lesson.apptId);
          if (error) { showToast("Update failed: " + error.message, "error"); return; }
        }
        showToast(tf("private.book_month_fixed", { n: mismatched.length }));
        changed = true;
      }
    }

    if (changed) await load();
  }

  async function resolveStudentForContact(contactId, personName) {
    const { data: existing } = await supabaseClient
      .from("students").select("id, name").eq("contact_id", contactId).eq("active", true).eq("is_group", false);
    const rows = existing ?? [];
    if (rows.length === 1) return rows[0].id;
    if (rows.length > 1) {
      // A family with >1 child — pick the one the AI named, else give up
      // and let Angela do it by hand rather than guess.
      const q = (personName ?? "").trim().toLowerCase();
      const hit = q ? rows.filter(r => (r.name ?? "").toLowerCase().includes(q) || q.includes((r.name ?? "").toLowerCase())) : [];
      if (hit.length === 1) return hit[0].id;
      throw new Error(t("private.pending_pick_student"));
    }
    const { data: newStudent, error } = await supabaseClient
      .from("students").insert({ contact_id: contactId, is_group: false, active: true, name: personName || null }).select().single();
    if (error) throw error;
    return newStudent.id;
  }

  async function loadPendingReviews() {
    const { data, error } = await supabaseClient
      .from("pending_actions")
      .select("id, proposed_appointment, created_at, messages(body, contacts(name, whatsapp_number))")
      .eq("status", "awaiting_review")
      .order("created_at", { ascending: false });
    pendingReviews = error ? [] : (data ?? []);
    renderPendingReviews();
  }

  function renderPendingReviews() {
    const card = document.getElementById("pending-reviews-card");
    const container = document.getElementById("pending-reviews");
    if (!pendingReviews.length) { card.style.display = "none"; return; }
    card.style.display = "";

    container.innerHTML = pendingReviews.map(p => {
      const c = p.messages?.contacts;
      const a = p.proposed_appointment;
      return `
        <div class="pending-review-row" data-pending-id="${p.id}">
          <strong>${c?.name ?? "?"}</strong>
          <span class="phone">${c?.whatsapp_number ?? ""}</span>
          <span>${a.intent}</span>
          <input type="date" class="pending-date" data-pending-date="${p.id}" value="${a.requested_date ?? ""}" />
          <input type="time" class="pending-time" data-pending-time="${p.id}" value="${a.requested_time ?? ""}" />
          <span class="confidence">(${Math.round((a.confidence ?? 0) * 100)}%)</span>
          <span class="time-ago">${timeAgo(p.created_at)}</span>
          <button type="button" class="link approve" data-approve="${p.id}">${t("private.approve")}</button>
          <button type="button" class="link reject" data-reject="${p.id}">${t("private.reject")}</button>
          <div class="rationale">${p.messages?.body ? `"${p.messages.body}"` : ""}${a.rationale ? " — " + a.rationale : ""}</div>
        </div>`;
    }).join("");
    applyI18n();

    container.querySelectorAll("[data-approve]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const p = pendingReviews.find(x => x.id === btn.dataset.approve);
        if (!p) return;
        const a = p.proposed_appointment;
        // Read from the date/time inputs, not the original AI-guessed
        // values — she may have corrected them inline before approving.
        const requestedDate = document.querySelector(`[data-pending-date="${p.id}"]`).value;
        const requestedTime = document.querySelector(`[data-pending-time="${p.id}"]`).value;
        if (!requestedDate || !requestedTime) {
          showToast(t("private.pending_missing_time"), "error");
          return;
        }
        const start = new Date(`${requestedDate}T${requestedTime}:00+08:00`);
        const minutes = a.duration_minutes_guess ?? 45;
        const end = new Date(start.getTime() + minutes * 60_000);
        let studentId;
        try {
          studentId = await resolveStudentForContact(a.contact_id, a.person_name);
        } catch (err) { showToast(err.message, "error", 4000); return; }

        // A "reschedule" moves an existing booking rather than creating a
        // second one — otherwise the original appointment stays "confirmed"
        // with its own never-cancelled Google Calendar event, silently
        // doubling the booking. Update the student's next upcoming
        // confirmed appointment in place when there is one; only insert
        // fresh if not.
        let moved = false;
        if (a.intent === "reschedule") {
          const { data: upcoming } = await supabaseClient
            .from("appointments").select("id").eq("student_id", studentId).eq("status", "confirmed")
            .gte("scheduled_start", new Date().toISOString()).order("scheduled_start", { ascending: true })
            .limit(1).maybeSingle();
          if (upcoming) {
            const { error } = await supabaseClient.from("appointments")
              .update({ scheduled_start: start.toISOString(), scheduled_end: end.toISOString() }).eq("id", upcoming.id);
            if (error) { showToast("Save failed: " + error.message, "error"); return; }
            moved = true;
          }
        }
        if (!moved) {
          // Guard against creating a second identical booking if one
          // already exists at this exact time — reuse it instead of
          // inserting again.
          const { data: existingAtTime } = await supabaseClient
            .from("appointments").select("id").eq("student_id", studentId).eq("status", "confirmed")
            .eq("scheduled_start", start.toISOString()).maybeSingle();
          if (!existingAtTime) {
            const { error: apptError } = await supabaseClient.from("appointments").insert({
              type: "lesson", lesson_format: "1on1", student_id: studentId,
              scheduled_start: start.toISOString(), scheduled_end: end.toISOString(),
              status: "confirmed", created_via: "whatsapp_ai_confirmed_by_angela",
            });
            if (apptError) { showToast("Save failed: " + apptError.message, "error"); return; }
          }
        }
        await supabaseClient.from("pending_actions").update({ status: "approved", reviewed_by: "angela", reviewed_at: new Date().toISOString() }).eq("id", p.id);
        await loadPendingReviews();
        await load();
        showToast(t("private.approved_confirm"), "success");
      });
    });

    container.querySelectorAll("[data-reject]").forEach(btn => {
      btn.addEventListener("click", async () => {
        await supabaseClient.from("pending_actions").update({ status: "rejected", reviewed_by: "angela", reviewed_at: new Date().toISOString() }).eq("id", btn.dataset.reject);
        await loadPendingReviews();
        showToast(t("private.rejected_confirm"), "success");
      });
    });
  }

  await load();
  await loadPendingReviews();
})();
</script>
