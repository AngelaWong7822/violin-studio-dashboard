<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Private Students</title>
<link rel="stylesheet" href="shared.css" />
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  #student-rows { font-size: 13px; }
  #student-rows td, thead th { padding: 7px 10px; }
  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    font-size: 11px; font-weight: 600; color: #fff;
    margin-right: 8px; flex-shrink: 0; vertical-align: middle;
  }
  .avatar.gender-female { background: #f472b6; }
  .avatar.gender-male { background: #60a5fa; }
  .avatar.gender-unknown { background: #a1a1aa; }
  .last-activity {
    display: inline-block; margin-left: 8px; padding: 1px 8px;
    background: #eff6ff; color: #1d4ed8; border-radius: 999px;
    font-size: 11px; font-weight: 600; vertical-align: middle;
  }
  .last-activity-message { background: #e7f9ee; color: #1e6b34; }
  .dialog-avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    font-size: 16px; font-weight: 600; color: #fff;
    flex-shrink: 0;
  }
  .dialog-avatar.gender-female { background: #f472b6; }
  .dialog-avatar.gender-male { background: #60a5fa; }
  .dialog-avatar.gender-unknown { background: #a1a1aa; }
  .field-icon {
    display: inline-block; width: 20px; font-size: 14px;
    text-align: center; vertical-align: -2px;
  }
  #student-form label { display: flex; flex-direction: column; gap: 4px; }
  #student-form label input, #student-form label select { width: 100%; }
  .field-label-row { display: flex; align-items: center; }
  .gender-toggle-group { display: flex; gap: 8px; margin-top: 4px; }
  .gender-toggle-btn {
    flex: 1; padding: 8px; border: 1px solid #d4d4d8; border-radius: 10px;
    background: #fff; color: #52525b; cursor: pointer; font: inherit; font-size: 14px;
    text-align: center; transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .gender-toggle-btn.active.gender-male { background: #60a5fa; border-color: #60a5fa; color: #fff; font-weight: 600; }
  .gender-toggle-btn.active.gender-female { background: #f472b6; border-color: #f472b6; color: #fff; font-weight: 600; }
  .toggle-switch { position: relative; display: inline-block; width: 34px; height: 19px; vertical-align: middle; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-switch .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: #d4d4d8; border-radius: 999px; transition: background-color 0.15s ease;
  }
  .toggle-switch .slider::before {
    content: ""; position: absolute; height: 13px; width: 13px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .toggle-switch input:checked + .slider { background: linear-gradient(135deg, #c4b5fd, #7c3aed); }
  .toggle-switch input:checked + .slider::before { transform: translateX(15px); }
  .row-menu-wrap { position: relative; display: inline-block; }
  .row-menu-btn {
    background: none; border: 1px solid #d4d4d8; border-radius: 8px;
    width: 26px; height: 26px; cursor: pointer; font-size: 15px; line-height: 1;
    color: #52525b; padding: 0; vertical-align: middle;
  }
  .row-menu-btn:hover { background: #f4f4f5; }
  .row-menu {
    display: none;
    position: absolute; right: 0; top: 120%;
    background: #fff; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06), 0 8px 20px rgba(0,0,0,0.14);
    padding: 6px; min-width: 130px; z-index: 20;
    flex-direction: column; gap: 2px;
  }
  .row-menu.open { display: flex; }
  .row-menu button {
    border: none; background: none; text-align: left; padding: 6px 10px;
    border-radius: 6px; cursor: pointer; font-size: 12px; color: #18181b; width: 100%; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
  }
  .row-menu button:hover { background: #f4f4f5; }
  .row-menu button.danger-item { color: #b91c1c; }
  .row-menu .menu-icon { width: 15px; text-align: center; font-size: 12px; flex-shrink: 0; }
  .whatsapp-chip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px;
    background: #e7f9ee; color: #1e6b34; text-decoration: none;
    border-radius: 50%; font-size: 13px;
  }
  .whatsapp-chip:hover { background: #d3f3e0; }
  .count-pill {
    display: inline-block; background: #f4f4f5; color: #27272a;
    padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .count-pill-paid { background: #eff6ff; color: #1d4ed8; }
  .next-lesson-badge {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    background: #fffbeb; color: #78350f; padding: 3px 10px;
    border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .regular-schedule-badge {
    display: inline-block; margin-left: 8px; padding: 1px 8px;
    background: #f3e8ff; color: #7e22ce; border-radius: 999px;
    font-size: 11px; font-weight: 600; vertical-align: middle; white-space: nowrap;
  }
  .regular-schedule-badge[data-edit-schedule] { cursor: pointer; }
  .regular-schedule-badge[data-edit-schedule]:hover { background: #e9d5ff; }
  .parent-tag {
    display: inline-block; margin-left: 8px; padding: 1px 7px;
    background: #f4f4f5; color: #71717a; border-radius: 999px;
    font-size: 10.5px; font-weight: 500; vertical-align: middle; white-space: nowrap;
  }
  .icon-action-btn { border: none; background: none; cursor: pointer; font-size: 15px; color: #71717a; padding: 2px 5px; border-radius: 4px; }
  .icon-action-btn:hover { color: #18181b; background: #f4f4f5; }
  .week-calendar-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .week-calendar-day {
    flex: 1 1 0; min-width: 108px; background: #fafafa; border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .week-calendar-day.is-today { background: #fffbeb; border: 1px solid #fde68a; }
  .week-calendar-day-header { text-align: center; padding-bottom: 6px; border-bottom: 1px solid #eee; }
  .week-calendar-daynum { font-size: 18px; font-weight: 700; color: #27272a; line-height: 1.1; }
  .week-calendar-weekday { font-size: 11px; color: #a1a1aa; }
  .week-calendar-day.is-today .week-calendar-daynum { color: #92400e; }
  .week-calendar-day.is-today .week-calendar-weekday { color: #b45309; }
  .week-calendar-lessons { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .week-calendar-lesson { display: flex; align-items: center; gap: 5px; background: #fff; border-radius: 8px; padding: 4px 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .week-calendar-lesson .avatar { width: 20px; height: 20px; font-size: 10px; margin-right: 0; }
  .week-calendar-lesson-info { display: flex; flex-direction: column; min-width: 0; }
  .week-calendar-time { font-size: 10px; color: #78350f; font-weight: 700; }
  .week-calendar-name { font-size: 11px; color: #27272a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 68px; }
  .week-calendar-empty { display: flex; align-items: center; justify-content: center; color: #d4d4d8; font-size: 11px; padding: 8px 0; }
  .wc-slots { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e4e4e7; display: flex; flex-direction: column; gap: 4px; }
  .wc-slots-label { font-size: 9px; font-weight: 700; letter-spacing: .06em; color: #16a34a; text-transform: uppercase; }
  .wc-slot { background: linear-gradient(135deg, #d1fae5, #bfdbfe); color: #065f46; font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px; text-align: center; }
  .wc-slot-none { font-size: 10px; color: #d4d4d8; }
  .week-calendar-lesson.is-group { background: #ede9fe; box-shadow: none; }
  .week-calendar-lesson.is-consult { background: #cffafe; box-shadow: none; }
  .week-calendar-lesson .wc-group-icon { width: 20px; text-align: center; font-size: 13px; }
  .week-calendar-lesson.is-group .week-calendar-time { color: #6d28d9; }
  .week-calendar-lesson.is-group .week-calendar-name { color: #5b21b6; }
  .week-calendar-lesson.is-consult .week-calendar-time { color: #0e7490; }
  .week-calendar-lesson.is-consult .week-calendar-name { color: #155e75; }
  .wc-del-btn { margin-left: auto; flex-shrink: 0; border: none; background: none; cursor: pointer; color: #d4d4d8; font-size: 11px; line-height: 1; padding: 2px 3px; border-radius: 4px; }
  .wc-del-btn:hover { color: #b91c1c; background: #fee2e2; }
  .week-calendar-name-link { cursor: pointer; }
  .week-calendar-name-link:hover { color: #7c3aed; text-decoration: underline; }
  @keyframes rowFlash { 0% { background: #fef9c3; } 100% { background: transparent; } }
  tr.student-row.row-flash > td { animation: rowFlash 1.6s ease-out; }
  .wc-hold { display: flex; align-items: center; gap: 4px; border: 1px dashed #f59e0b; background: #fffbeb; color: #92400e; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 7px; }
  .wc-undated { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding: 8px 10px; background: #fffbeb; border: 1px dashed #f59e0b; border-radius: 10px; }
  .wc-undated-label { font-size: 11px; font-weight: 700; color: #92400e; }
  .wc-undated-item { font-size: 11px; color: #78350f; background: #fef3c7; border-radius: 999px; padding: 2px 9px; cursor: help; }
  .free-slots-settings { display: flex; flex-direction: column; gap: 12px; background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .free-slots-settings[hidden] { display: none; }
  .fs-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #71717a; }
  .fs-time-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .fs-weekday-toggles { display: flex; gap: 5px; flex-wrap: wrap; }
  .fs-weekday-btn { border: 1px solid #d4d4d8; background: #fff; color: #71717a; width: 34px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .fs-weekday-btn.on { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 700; }
  .slot-hold-note { margin-top: 10px; font-size: 11px; color: #92400e; background: #fffbeb; border-radius: 10px; padding: 6px 10px; }
  .search-wrap { position: relative; width: 100%; max-width: 280px; }
  .search-wrap .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; opacity: 0.6; }
  #student-search { width: 100%; padding: 8px 10px 8px 30px; border-radius: 10px; border: 1px solid #d4d4d8; font: inherit; }
  .student-row { cursor: pointer; }
  .student-row:hover { background: #f4f4f5; }
  .expand-arrow { display: inline-block; width: 14px; transition: transform 0.15s; }
  .expand-arrow.open { transform: rotate(90deg); }
  .student-detail td { padding: 0 0 14px 0; }
  .detail-summary { display: flex; gap: 8px; margin: 2px 26px 10px 26px; }
  .lesson-table-wrap { margin: 6px 26px 0 26px; }
  .detail-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .detail-table th, .detail-table td { padding: 4px 8px; text-align: left; }
  .detail-table th { color: #71717a; font-weight: 500; }
  .detail-table tr:nth-child(even) { background: #fafafa; }
  .detail-table input[type=number] { width: 80px; font-size: 13px; padding: 3px 5px; }
  .att-toggle { font-size: 12px; padding: 2px 4px; width: 46px; text-align: center; border: none; border-radius: 14px; background: #f4f4f5; color: #71717a; cursor: pointer; font-weight: 600; }
  .att-toggle.att-attended { background: #1e6b34; color: #fff; }
  .att-toggle.att-leave { background: #b8863a; color: #fff; }
  .att-toggle.att-no_show { background: #b91c1c; color: #fff; }
  .pending-review-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid #f0f0f1; font-size: 13px; }
  .pending-review-row:last-child { border-bottom: none; }
  .pending-review-row .rationale { color: #71717a; width: 100%; }
  .pending-review-row .phone { color: #71717a; }
  .pending-review-row .confidence { color: #a1a1aa; }
  .pending-review-row .time-ago { color: #a1a1aa; font-size: 12px; }
  .pending-review-row .link.approve { color: #1e6b34; }
  .pending-review-row .link.reject { color: #b91c1c; }
  .pending-review-row .pending-date, .pending-review-row .pending-time { font-size: 13px; padding: 2px 4px; }
</style>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="logo.png" alt="" class="brand-logo">Violin Studio</span>
  <a href="index.html" data-i18n="nav.schedule">Schedule</a>
  <a href="leads.html" data-i18n="nav.leads">Leads</a>
  <a href="packages.html" data-i18n="nav.packages">Group Classes</a>
  <a href="private.html" class="active" data-i18n="nav.private">Private Students</a>
  <a href="homework-links.html" data-i18n="nav.homework_links">Homework Links</a>
  <a href="receipt.html" data-i18n="nav.receipt">Receipt</a>
  <a href="accounting.html" data-i18n="nav.accounting">Accounting</a>
  <span class="spacer"></span>
  <div class="settings-wrap">
    <button id="settings-btn" title="Settings">⚙️</button>
    <div id="settings-menu" class="settings-menu" style="display:none;">
      <button id="settings-lang-toggle" data-lang-toggle>中文</button>
      <button id="settings-export-btn" data-i18n="settings.export_data">Export all data (Excel)</button>
    </div>
  </div>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;">
      <h1 style="margin:0;" data-i18n="private.week_bookings_title">This Week's Bookings</h1>
      <button type="button" id="free-slots-settings-toggle" class="link" style="font-size:12px;">⚙️ <span data-i18n="private.free_slots_settings">Teaching hours</span></button>
    </div>
    <div id="free-slots-settings" class="free-slots-settings" hidden>
      <label class="fs-field"><span data-i18n="private.fs_weekdays">Teaching days</span>
        <span style="font-size:11px; color:#a1a1aa;" data-i18n="private.fs_weekdays_hint">Purple = teaching that day. Click to toggle.</span>
        <div id="fs-weekday-toggles" class="fs-weekday-toggles"></div>
      </label>
      <div class="fs-time-row">
        <label class="fs-field"><span data-i18n="private.fs_start">From</span><input type="time" id="fs-start" /></label>
        <label class="fs-field"><span data-i18n="private.fs_end">To</span><input type="time" id="fs-end" /></label>
        <label class="fs-field"><span data-i18n="private.fs_gap">Buffer (min)</span><input type="number" id="fs-gap" min="0" step="5" style="width:70px;" /></label>
      </div>
      <button type="button" class="primary" id="fs-save" data-i18n="dialog.save" style="align-self:flex-start;">Save</button>
    </div>
    <div id="week-bookings-list"></div>
  </div>
  <div class="card" id="pending-reviews-card" style="display:none;">
    <h1 style="margin:0 0 10px;" data-i18n="private.pending_reviews_title">WhatsApp bookings needing review</h1>
    <div id="pending-reviews"></div>
  </div>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;">
      <h1 style="margin:0;" data-i18n="private.title">Private Students</h1>
      <button class="primary" id="new-student-btn" data-i18n="private.new_student">+ New student</button>
    </div>
    <div class="search-wrap" style="margin-bottom:10px;">
      <span class="search-icon">🔍</span>
      <input type="text" id="student-search" data-i18n-placeholder="private.search_placeholder" placeholder="Search by name…" />
    </div>
    <table>
      <thead><tr>
        <th></th>
        <th data-i18n="student.name">Name</th>
        <th data-i18n="private.col_next_lesson" style="text-align:center;">Next lesson</th>
        <th data-i18n="private.col_whatsapp">Wts</th>
        <th data-i18n="contacts.col_allowed">Allowed (AI analyzes)</th>
        <th></th>
      </tr></thead>
      <tbody id="student-rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<dialog id="student-dialog" style="border:none; border-radius:16px; padding:0; width:340px;">
  <form id="student-form" class="card" style="margin:0; box-shadow:none;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
      <span class="dialog-avatar gender-unknown" id="student-dialog-avatar">?</span>
      <h1 id="student-dialog-title" style="margin:0;" data-i18n="dialog.new_student">New student</h1>
    </div>
    <input type="hidden" id="student-contact-id" />
    <input type="hidden" id="student-id" />
    <input type="hidden" id="student-sibling-contact-id" />
    <div style="display:flex; flex-direction:column; gap:10px;">
      <p id="student-parent-hint" style="margin:0; font-size:12px; color:#7c3aed; background:#f5f3ff; border-radius:8px; padding:6px 9px;" hidden></p>
      <label><span class="field-label-row"><span class="field-icon">👤</span><span data-i18n="student.name">Name</span></span><input type="text" id="student-name" required /></label>
      <label><span class="field-label-row"><span class="field-icon">💬</span><span data-i18n="student.phone">WhatsApp number</span></span><input type="text" id="student-phone" /></label>
      <label><span class="field-label-row"><span class="field-icon"></span><span data-i18n="student.gender">Gender</span></span>
        <input type="hidden" id="student-gender" value="male" />
        <div class="gender-toggle-group">
          <button type="button" class="gender-toggle-btn gender-male" data-gender-option="male" data-i18n="gender.male">Male</button>
          <button type="button" class="gender-toggle-btn gender-female" data-gender-option="female" data-i18n="gender.female">Female</button>
        </div>
      </label>
      <label><span class="field-label-row"><span class="field-icon">🎂</span><span data-i18n="student.age">Age</span></span><input type="number" id="student-age" min="0" step="1" /></label>
      <label><span class="field-label-row"><span class="field-icon">📱</span><span data-i18n="lead.social_media_name">Social media name</span></span><input type="text" id="student-social" /></label>
      <label><span class="field-label-row"><span class="field-icon">🎻</span><span data-i18n="lead.level">Level</span></span><input type="text" id="student-level" data-i18n-placeholder="lead.level_placeholder" placeholder="e.g. Beginner / Grade 3" /></label>
      <label><span class="field-label-row"><span class="field-icon">🔁</span><span data-i18n="private.regular_schedule">Regular weekly time</span></span>
        <div style="display:flex; gap:8px;">
          <select id="student-regular-weekday" style="flex:1;">
            <option value="" data-i18n="private.regular_none">Not regular</option>
            <option value="0" data-i18n="weekday_full.0">Sunday</option>
            <option value="1" data-i18n="weekday_full.1">Monday</option>
            <option value="2" data-i18n="weekday_full.2">Tuesday</option>
            <option value="3" data-i18n="weekday_full.3">Wednesday</option>
            <option value="4" data-i18n="weekday_full.4">Thursday</option>
            <option value="5" data-i18n="weekday_full.5">Friday</option>
            <option value="6" data-i18n="weekday_full.6">Saturday</option>
          </select>
          <input type="time" id="student-regular-time" style="flex:1;" />
        </div>
      </label>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="link" id="student-cancel-btn" data-i18n="dialog.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="dialog.save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="lesson-dialog" style="border:none; border-radius:10px; padding:0; width:320px;">
  <form id="lesson-form" class="card" style="margin:0; box-shadow:none;">
    <h1 data-i18n="private.new_lesson">New lesson</h1>
    <input type="hidden" id="lesson-student-id" />
    <div style="display:flex; flex-direction:column; gap:10px;">
      <p style="margin:0; font-size:13px; color:#71717a;" id="lesson-student-name"></p>
      <label><span data-i18n="private.lesson_when">Date &amp; time</span>
        <input type="datetime-local" id="lesson-when" required />
      </label>
      <label><span data-i18n="private.lesson_format">Format</span>
        <select id="lesson-format">
          <option value="1on1" data-i18n="format.1on1">1-on-1</option>
          <option value="1on2" data-i18n="format.1on2">1-on-2</option>
        </select>
      </label>
      <label><span data-i18n="private.lesson_duration">Duration (min)</span>
        <select id="lesson-duration">
          <option value="45">45</option>
          <option value="60">60</option>
        </select>
      </label>
      <label><span data-i18n="private.lesson_price">Price ($)</span>
        <input type="number" id="lesson-price" min="0" value="750" required />
      </label>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button type="button" class="link" id="lesson-cancel-btn" data-i18n="dialog.cancel">Cancel</button>
        <button type="submit" class="primary" data-i18n="dialog.save">Save</button>
      </div>
    </div>
  </form>
</dialog>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  initSettingsMenu();
  window.onLangChange = () => { load(); loadPendingReviews(); };
  document.addEventListener("click", () => {
    document.querySelectorAll(".row-menu.open").forEach(m => m.classList.remove("open"));
  });

  // Private (1-on-1 / 1-on-2) students: no package/batch concept, no
  // auto-deduction — each lesson is logged and priced individually. This
  // mirrors the Payments page's expandable-row pattern but per lesson
  // instead of per term, and the click-to-cycle status toggle from Attendance.
  const ATTENDANCE_CYCLE = ["", "attended", "leave", "no_show"];
  function nextAttendanceStatus(current) {
    const idx = ATTENDANCE_CYCLE.indexOf(current || "");
    return ATTENDANCE_CYCLE[(idx + 1) % ATTENDANCE_CYCLE.length];
  }
  // Maps whatsapp-ingest's raw `intent` field (see supabase/functions/
  // whatsapp-ingest/index.ts) to a short label for the AI message log —
  // "none" covers plain chit-chat with no scheduling content at all.
  function intentLabel(llmParseResult) {
    const intent = llmParseResult?.intent;
    if (!intent) return t("private.intent_unanalyzed");
    return t("private.intent_" + intent);
  }
  function attendanceSymbol(status) {
    if (status === "attended") return "✓";
    if (status === "leave") return t("attstatus.leave");
    if (status === "no_show") return "✕";
    return "-";
  }

  const expandedIds = new Set();
  let students = []; // [{ id, name, regular_weekday, regular_time, contacts, lessons: [...] }]

  // A student's own name once families can have >1 child (migration 0029);
  // older rows with a null students.name fall back to the contact's name.
  function studentLabel(s) { return s?.name || s?.contacts?.name || ""; }

  async function load() {
    const tbody = document.getElementById("student-rows");
    const { data, error } = await supabaseClient
      .from("students")
      .select("id, contact_id, name, regular_weekday, regular_time, contacts(name, whatsapp_number, gender, age, allowed_for_ai, social_media_name, level, regular_weekday, regular_time)")
      .eq("active", true)
      .eq("is_group", false)
      .order("created_at", { ascending: false });
    if (error) { tbody.innerHTML = `<tr><td colspan="6" class="empty">Error: ${error.message}</td></tr>`; return; }

    students = await Promise.all(data.map(async (s) => {
      const { data: appts } = await supabaseClient
        .from("appointments")
        .select("id, scheduled_start, scheduled_end, lesson_format, price, created_via, created_at")
        .eq("student_id", s.id).eq("type", "lesson").is("class_id", null)
        .neq("status", "cancelled")
        .order("scheduled_start", { ascending: false });

      const apptIds = (appts ?? []).map(a => a.id);
      let attRows = [];
      if (apptIds.length) {
        const { data: att } = await supabaseClient
          .from("attendance").select("id, appointment_id, status, paid")
          .eq("student_id", s.id).in("appointment_id", apptIds);
        attRows = att ?? [];
      }

      const lessons = (appts ?? []).map(a => {
        const att = attRows.find(r => r.appointment_id === a.id);
        return {
          apptId: a.id, attendanceId: att?.id ?? null,
          when: a.scheduled_start, whenEnd: a.scheduled_end, format: a.lesson_format, price: a.price ?? 0,
          status: att?.status ?? null, paid: att?.paid ?? false, created_via: a.created_via,
          createdAt: a.created_at,
        };
      });
      // Badge shown next to the name so it's obvious at a glance which
      // students the WhatsApp AI added on its own vs. ones added by hand.
      const isAiCreated = lessons.some(l => l.created_via === "whatsapp_ai_auto" || l.created_via === "whatsapp_ai_confirmed_by_angela");
      // The soonest lesson that hasn't happened yet — shown as its own
      // column so Angela can see at a glance when someone's next due in,
      // without opening the row.
      const now = new Date();
      const nextLesson = lessons
        .filter(l => new Date(l.when) >= now)
        .sort((a, b) => new Date(a.when) - new Date(b.when))[0] ?? null;

      // The raw WhatsApp messages whatsapp-ingest has seen for this contact,
      // plus its AI intent read on each one — shown so Angela can spot-check
      // what the auto-marking actually picked up, and prune old ones that
      // are no longer worth keeping.
      const { data: messages } = await supabaseClient
        .from("messages")
        .select("id, direction, body, llm_parse_result, created_at")
        .eq("contact_id", s.contact_id)
        .order("created_at", { ascending: false });

      const lastMessageAt = messages?.[0]?.created_at ?? null;

      return { ...s, lessons, isAiCreated, nextLesson, lastMessageAt, messages: messages ?? [] };
    }));

    // Students with a recent WhatsApp message float to the top (newest
    // first); students with no message history yet keep their original
    // order (newest-created student first) at the bottom.
    students.sort((a, b) => {
      if (a.lastMessageAt && b.lastMessageAt) return b.lastMessageAt.localeCompare(a.lastMessageAt);
      if (a.lastMessageAt) return -1;
      if (b.lastMessageAt) return 1;
      return 0;
    });

    // Keep siblings (same parent contact) adjacent, anchored where their
    // most-active member already sorted to. Map preserves insertion order.
    const byContact = new Map();
    for (const s of students) {
      if (!byContact.has(s.contact_id)) byContact.set(s.contact_id, []);
      byContact.get(s.contact_id).push(s);
    }
    students = [...byContact.values()].flat();

    renderWeekCalendar();
    render();
  }

  // ---------- Week calendar (booked lessons + suggested trial slots) ----------
  const FREE_SLOTS_MIN_LENGTH = 25;   // a trial/interview runs ~20-30 min, so a 25-min gap is already offerable
  const FREE_SLOTS_DAYS = 7;
  let studioSettings = null;

  function parseHM(str) { const [h, m] = (str || "0:0").split(":").map(Number); return h * 60 + m; }
  // "3:15-4:00pm" — am/pm shown once at the end, and also on the start only
  // when the range crosses noon (e.g. "11:30am-1:00pm").
  function fmtSlotRange(startMin, endMin) {
    const part = (mins, withSuffix) => {
      const h = Math.floor(mins / 60), m = mins % 60;
      const suffix = withSuffix ? (h >= 12 ? "pm" : "am") : "";
      return `${h % 12 || 12}:${String(m).padStart(2, "0")}${suffix}`;
    };
    const crossesNoon = (startMin >= 720) !== (endMin >= 720);
    return `${part(startMin, crossesNoon)}-${part(endMin, true)}`;
  }

  // Given a day's [windowStart, windowEnd] and busy intervals (minutes from
  // midnight), return the free blocks with `minGap` kept clear around every
  // busy interval and nothing shorter than `minSlot`.
  function computeFreeSlots(windowStart, windowEnd, busyIntervals, minGap, minSlot) {
    if (windowEnd <= windowStart) return [];
    const merged = [];
    busyIntervals
      .map(b => ({ start: b.start - minGap, end: b.end + minGap }))
      .sort((a, b) => a.start - b.start)
      .forEach(iv => {
        const last = merged[merged.length - 1];
        if (last && iv.start <= last.end) last.end = Math.max(last.end, iv.end);
        else merged.push({ ...iv });
      });
    const free = [];
    let cursor = windowStart;
    for (const iv of merged) {
      if (iv.start - cursor >= minSlot) free.push({ start: cursor, end: Math.min(iv.start, windowEnd) });
      cursor = Math.max(cursor, iv.end);
      if (cursor >= windowEnd) break;
    }
    if (windowEnd - cursor >= minSlot) free.push({ start: cursor, end: windowEnd });
    return free.filter(f => f.end - f.start >= minSlot && f.start >= windowStart && f.end <= windowEnd);
  }

  // ---------- Teaching-hours settings ----------
  function renderFreeSlotsSettingsForm() {
    const cfg = studioSettings || { available_weekdays: "1,2,3,4,5,6", available_start: "10:00", available_end: "20:00", min_gap_minutes: 15 };
    const on = new Set((cfg.available_weekdays || "").split(",").map(s => Number(s.trim())));
    document.getElementById("fs-weekday-toggles").innerHTML = [1, 2, 3, 4, 5, 6, 0]
      .map(d => `<button type="button" class="fs-weekday-btn${on.has(d) ? " on" : ""}" data-weekday="${d}">${t("day." + d)}</button>`).join("");
    document.getElementById("fs-weekday-toggles").querySelectorAll(".fs-weekday-btn").forEach(b => {
      b.addEventListener("click", () => b.classList.toggle("on"));
    });
    document.getElementById("fs-start").value = cfg.available_start ?? "10:00";
    document.getElementById("fs-end").value = cfg.available_end ?? "20:00";
    document.getElementById("fs-gap").value = cfg.min_gap_minutes ?? 15;
  }
  document.getElementById("free-slots-settings-toggle").addEventListener("click", () => {
    const box = document.getElementById("free-slots-settings");
    box.hidden = !box.hidden;
    if (!box.hidden) renderFreeSlotsSettingsForm();
  });
  document.getElementById("fs-save").addEventListener("click", async () => {
    const weekdays = [...document.querySelectorAll("#fs-weekday-toggles .fs-weekday-btn.on")]
      .map(b => b.dataset.weekday).sort((a, b) => a - b).join(",");
    const payload = {
      id: true,
      available_weekdays: weekdays,
      available_start: document.getElementById("fs-start").value || "10:00",
      available_end: document.getElementById("fs-end").value || "20:00",
      min_gap_minutes: parseInt(document.getElementById("fs-gap").value, 10) || 0,
    };
    const { error } = await supabaseClient.from("studio_settings").upsert(payload);
    if (error) { showToast("Save failed: " + error.message, "error"); return; }
    studioSettings = payload;
    document.getElementById("free-slots-settings").hidden = true;
    await renderWeekCalendar();
  });

  // "3:15-4:00pm" for a booked lesson, same style as the open-slot ranges.
  // Falls back to just the start time if there's no end recorded.
  function fmtLessonRange(startIso, endIso) {
    const s = new Date(startIso);
    const startMin = s.getHours() * 60 + s.getMinutes();
    if (!endIso) {
      const h = s.getHours();
      return `${h % 12 || 12}:${String(s.getMinutes()).padStart(2, "0")}${h >= 12 ? "pm" : "am"}`;
    }
    const e = new Date(endIso);
    return fmtSlotRange(startMin, e.getHours() * 60 + e.getMinutes());
  }

  // One 7-day calendar strip that shows BOTH what's booked (top of each day
  // column) and the free windows still open for a trial ("面試") below it —
  // "已約 + 可約" in a single glance, per Angela's request.
  async function renderWeekCalendar() {
    const el = document.getElementById("week-bookings-list");
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const rangeEnd = new Date(startOfToday.getTime() + 7 * 86400000);

    // Teaching-hours config — defaults if the row/table isn't there yet.
    if (!studioSettings) {
      const { data } = await supabaseClient.from("studio_settings").select("*").maybeSingle();
      studioSettings = data ?? { available_weekdays: "1,2,3,4,5,6", available_start: "10:00", available_end: "20:00", min_gap_minutes: 15 };
    }
    const cfg = studioSettings;
    let workDays = new Set((cfg.available_weekdays || "").split(",").map(s => Number(s.trim())).filter(n => !Number.isNaN(n)));
    // A blank list would otherwise make every day read "not teaching" —
    // treat "nothing set" as "every day" and let her narrow it in settings.
    if (workDays.size === 0) workDays = new Set([0, 1, 2, 3, 4, 5, 6]);
    const winStartMin = parseHM(cfg.available_start);
    const winEndMin = parseHM(cfg.available_end);
    const gap = Number(cfg.min_gap_minutes) || 0;

    // Every confirmed appointment in the window — private lessons, group
    // classes AND booked consultations (面試, from leads.html) — plus the
    // WhatsApp proposals still awaiting review, which are the "a parent's
    // still deciding, keep it free" holds that also block a suggested slot.
    const [{ data: appts }, { data: pending }] = await Promise.all([
      supabaseClient.from("appointments")
        .select("id, lead_id, scheduled_start, scheduled_end, type, notes, classes(name), leads!appointments_lead_id_fkey(contacts(name))")
        .neq("status", "cancelled")
        .gte("scheduled_start", startOfToday.toISOString())
        .lt("scheduled_start", rangeEnd.toISOString()),
      supabaseClient.from("pending_actions")
        .select("proposed_appointment, messages(contacts(name))")
        .eq("status", "awaiting_review"),
    ]);

    const busyByDateKey = new Map();
    const addBusy = (start, end) => {
      const key = start.toDateString();
      if (!busyByDateKey.has(key)) busyByDateKey.set(key, []);
      busyByDateKey.get(key).push({
        start: start.getHours() * 60 + start.getMinutes(),
        end: end.getHours() * 60 + end.getMinutes(),
      });
    };
    // Group classes and consultations get their own coloured cards in each
    // day column; every appointment (incl. private lessons) feeds the busy
    // set that the free-slot maths works off.
    const apptCardsByDateKey = new Map();
    (appts ?? []).forEach(a => {
      const s = new Date(a.scheduled_start);
      const e = a.scheduled_end ? new Date(a.scheduled_end) : new Date(s.getTime() + 45 * 60000);
      addBusy(s, e);
      let card = null;
      if (a.type === "group_class") {
        card = { when: a.scheduled_start, whenEnd: a.scheduled_end, kind: "group", name: a.classes?.name || t("private.wc_group") };
      } else if (a.type === "consultation") {
        card = { when: a.scheduled_start, whenEnd: a.scheduled_end, kind: "consult", name: a.leads?.contacts?.name || a.notes || t("private.wc_consult"), apptId: a.id, leadId: a.lead_id };
      }
      if (card) {
        const key = s.toDateString();
        if (!apptCardsByDateKey.has(key)) apptCardsByDateKey.set(key, []);
        apptCardsByDateKey.get(key).push(card);
      }
    });

    // WhatsApp proposals still awaiting review. Ones with a concrete
    // proposed time become a dashed card sorted into that day's timeline;
    // ones the AI couldn't pin to a date/time yet (e.g. "下星期一至三下午
    // 3點左右") can't sit in a column, so they go in a small strip under
    // the grid as a heads-up to go handle them in the "待確認" panel.
    const holdsByDateKey = new Map();
    const undatedPending = [];
    (pending ?? []).forEach(p => {
      const pa = p.proposed_appointment || {};
      if (!pa.requested_date || !pa.requested_time) {
        if (pa.intent && pa.intent !== "none" && pa.intent !== "general_inquiry") {
          undatedPending.push({ name: p.messages?.contacts?.name ?? "?", intent: pa.intent, rationale: pa.rationale ?? "" });
        }
        return;
      }
      const s = new Date(`${pa.requested_date}T${pa.requested_time}:00`);
      if (isNaN(s) || s < startOfToday || s >= rangeEnd) return;
      const durMin = pa.duration_minutes_guess || 45;
      const e = new Date(s.getTime() + durMin * 60000);
      addBusy(s, e);
      const key = s.toDateString();
      if (!holdsByDateKey.has(key)) holdsByDateKey.set(key, []);
      holdsByDateKey.get(key).push({
        when: s.toISOString(),
        start: s.getHours() * 60 + s.getMinutes(),
        end: e.getHours() * 60 + e.getMinutes(),
        name: p.messages?.contacts?.name ?? "",
      });
    });

    // This student's own private lessons, for the "已約" part of each column.
    const allLessons = students
      .flatMap(s => s.lessons.map(l => ({ ...l, studentId: s.id, studentName: studentLabel(s), gender: s.contacts?.gender })));

    let totalBooked = 0;
    const daysHtml = [];
    for (let i = 0; i < 7; i++) {
      const day = new Date(startOfToday.getTime() + i * 86400000);
      const isToday = i === 0;
      const dayEnd = new Date(day.getTime() + 86400000);
      const dateKey = day.toDateString();

      // Private lessons + group classes + consultations + "still deciding"
      // holds, all in one list sorted by start time so the column reads
      // top-to-bottom in real time order. Today's column keeps lessons that
      // have already happened earlier today — she still wants to see that
      // e.g. an irregular student had a lesson this afternoon; only the
      // free-slot suggestions below skip time that's already passed.
      const items = [];
      allLessons.forEach(l => {
        const w = new Date(l.when);
        if (w >= day && w < dayEnd) {
          items.push({ apptId: l.apptId, studentId: l.studentId, when: l.when, whenEnd: l.whenEnd, kind: "private", name: l.studentName, gender: l.gender });
        }
      });
      (apptCardsByDateKey.get(dateKey) ?? []).forEach(c => items.push(c));
      items.sort((a, b) => new Date(a.when) - new Date(b.when));
      totalBooked += items.length; // holds aren't booked lessons — count first

      (holdsByDateKey.get(dateKey) ?? []).forEach(h => items.push({ ...h, kind: "hold" }));
      items.sort((a, b) => new Date(a.when) - new Date(b.when));

      const lessonsHtml = items.map(it => {
        if (it.kind === "hold") {
          return `<div class="wc-hold">📌 ${fmtSlotRange(it.start, it.end)}${it.name ? " · " + tf("private.wc_hold_by", { name: it.name }) : ""}</div>`;
        }
        if (it.kind === "group" || it.kind === "consult") {
          const icon = it.kind === "group" ? "👥" : "🔍";
          // Consultations can be called off from here (cancels the appointment
          // + frees the lead's pointer). Group classes can't — that belongs
          // in packages.html, where the enrolled students / make-ups get
          // handled too.
          const delBtn = it.kind === "consult"
            ? `<button type="button" class="wc-del-btn" data-cal-del-consult="${it.apptId}" data-lead-id="${it.leadId ?? ""}" title="${t("private.cancel_consult")}" aria-label="${t("private.cancel_consult")}">✕</button>`
            : "";
          return `<div class="week-calendar-lesson is-${it.kind}">
              <span class="wc-group-icon">${icon}</span>
              <span class="week-calendar-lesson-info">
                <span class="week-calendar-time">${fmtLessonRange(it.when, it.whenEnd)}</span>
                <span class="week-calendar-name">${it.name}</span>
              </span>
              ${delBtn}
            </div>`;
        }
        const genderClass = it.gender === "female" ? "female" : it.gender === "male" ? "male" : "unknown";
        const initial = (it.name || "?").trim().charAt(0).toUpperCase() || "?";
        return `<div class="week-calendar-lesson">
              <span class="avatar gender-${genderClass}">${initial}</span>
              <span class="week-calendar-lesson-info">
                <span class="week-calendar-time">${fmtLessonRange(it.when, it.whenEnd)}</span>
                <span class="week-calendar-name week-calendar-name-link" data-jump-student="${it.studentId}" title="${t("private.jump_to_student")}">${it.name}</span>
              </span>
              <button type="button" class="wc-del-btn" data-cal-del-lesson="${it.apptId}" title="${t("private.delete_lesson")}" aria-label="${t("private.delete_lesson")}">✕</button>
            </div>`;
      }).join("");

      const isWorkDay = workDays.has(day.getDay());
      let slotsInner;
      if (!isWorkDay) {
        slotsInner = `<div class="wc-slot-none">${t("private.fs_off_day")}</div>`;
      } else {
        const dayWinStart = isToday ? Math.max(winStartMin, now.getHours() * 60 + now.getMinutes()) : winStartMin;
        const slots = computeFreeSlots(dayWinStart, winEndMin, busyByDateKey.get(dateKey) ?? [], gap, FREE_SLOTS_MIN_LENGTH);
        slotsInner = `<div class="wc-slots-label">${t("private.wc_open")}</div>` + (slots.length
          ? slots.map(s => `<div class="wc-slot">${fmtSlotRange(s.start, s.end)}</div>`).join("")
          : `<div class="wc-slot-none">${t("private.fs_full")}</div>`);
      }

      daysHtml.push(`
        <div class="week-calendar-day${isToday ? " is-today" : ""}">
          <div class="week-calendar-day-header">
            <div class="week-calendar-daynum">${day.getDate()}</div>
            <div class="week-calendar-weekday">${t("day." + day.getDay())}</div>
          </div>
          <div class="week-calendar-lessons">${lessonsHtml || `<div class="week-calendar-empty">—</div>`}</div>
          <div class="wc-slots">${slotsInner}</div>
        </div>`);
    }

    const undatedHtml = undatedPending.length
      ? `<div class="wc-undated">
          <span class="wc-undated-label">🤔 ${t("private.wc_undated")}</span>
          ${undatedPending.map(u => `<span class="wc-undated-item" title="${String(u.rationale).replace(/"/g, "&quot;")}">${u.name} · ${t("private.intent_" + u.intent)}</span>`).join("")}
        </div>`
      : "";

    el.innerHTML =
      `<p style="margin:0 0 10px; color:#71717a; font-size:12px;">${tf("private.week_bookings_count", { n: totalBooked })}</p>` +
      `<div class="week-calendar-grid">${daysHtml.join("")}</div>` +
      undatedHtml;
    applyI18n();

    // Cancel a private lesson straight from the calendar. "Cancel, don't
    // hard-delete" (an UPDATE) is what keeps calendar-sync able to remove
    // the matching Google Calendar event — same reasoning as the row-level
    // delete. Group classes are the one thing NOT cancellable here: that
    // belongs in packages.html, where enrolled students / make-ups get
    // handled too.
    el.querySelectorAll("button[data-cal-del-lesson]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!(await showConfirm(t("private.delete_lesson_confirm")))) return;
        const { error } = await supabaseClient.from("appointments").update({ status: "cancelled" }).eq("id", btn.dataset.calDelLesson);
        if (error) { showToast("Delete failed: " + error.message, "error"); return; }
        await load();
      });
    });

    // Cancel a booked consultation: same appointment cancel, plus clear the
    // lead's consultation_appointment_id so leads.html stops pointing at it
    // (mirrors that page's own "cancel consultation" button).
    el.querySelectorAll("button[data-cal-del-consult]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!(await showConfirm(t("private.cancel_consult_confirm")))) return;
        const apptId = btn.dataset.calDelConsult;
        const leadId = btn.dataset.leadId;
        const { error } = await supabaseClient.from("appointments").update({ status: "cancelled" }).eq("id", apptId);
        if (error) { showToast("Cancel failed: " + error.message, "error"); return; }
        if (leadId) {
          await supabaseClient.from("leads").update({ consultation_appointment_id: null }).eq("id", leadId).eq("consultation_appointment_id", apptId);
        }
        await load();
      });
    });

    // Click a lesson's student name -> jump down to that student's row in
    // the "私人學生" table, expanded (which shows their AI對話記錄), for a
    // quick fact-check against what the booking actually was.
    el.querySelectorAll("[data-jump-student]").forEach(nameEl => {
      nameEl.addEventListener("click", (e) => {
        e.stopPropagation();
        const sid = nameEl.dataset.jumpStudent;
        if (!sid) return;
        const searchEl = document.getElementById("student-search");
        if (searchEl && searchEl.value) searchEl.value = ""; // don't let a filter hide the target
        expandedIds.add(sid);
        render();
        const row = document.querySelector(`tr.student-row[data-student-id="${sid}"]`);
        if (row) {
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          row.classList.add("row-flash");
          setTimeout(() => row.classList.remove("row-flash"), 1600);
        }
      });
    });
  }

  function render() {
    const tbody = document.getElementById("student-rows");
    if (!students.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${t("private.empty_students")}</td></tr>`;
      return;
    }

    const q = (document.getElementById("student-search")?.value ?? "").trim().toLowerCase();
    const shown = q ? students.filter(s => `${studentLabel(s)} ${s.contacts?.name ?? ""}`.toLowerCase().includes(q)) : students;
    if (!shown.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${t("private.search_no_match")}</td></tr>`;
      return;
    }

    tbody.innerHTML = shown.map((s) => {
      const totalPaid = s.lessons.filter(l => l.paid).reduce((sum, l) => sum + (l.price ?? 0), 0);
      const isOpen = expandedIds.has(s.id);
      const rawPhone = s.contacts?.whatsapp_number ?? "";
      const digitsOnly = rawPhone.replace(/[^0-9]/g, "");
      const whatsappCell = rawPhone && digitsOnly
        ? `<a class="whatsapp-chip" href="https://wa.me/${digitsOnly}" target="_blank" rel="noopener" title="${rawPhone}">💬</a>`
        : "—";

      const lessonRows = s.lessons.map(l => `
        <tr>
          <td>${new Date(l.when).toLocaleString(localeForDates(), { dateStyle: "medium", timeStyle: "short" })}</td>
          <td>${t("format." + l.format)}</td>
          <td><input type="number" min="0" data-price-appt="${l.apptId}" value="${l.price}" /></td>
          <td><button type="button" class="att-toggle att-${l.status || "unset"}" data-appt-id="${l.apptId}" data-student-id="${s.id}" data-attendance-id="${l.attendanceId ?? ""}" data-status="${l.status || ""}">${attendanceSymbol(l.status)}</button></td>
          <td><input type="checkbox" data-paid-attendance-id="${l.attendanceId ?? ""}" data-paid-appt-id="${l.apptId}" data-paid-student-id="${s.id}" ${l.paid ? "checked" : ""} /></td>
          <td><button type="button" class="link" data-delete-lesson="${l.apptId}" style="color:#b91c1c;">${t("private.delete_lesson")}</button></td>
        </tr>`).join("");

      const messageRows = s.messages.map(m => `
        <tr>
          <td>${new Date(m.created_at).toLocaleString(localeForDates(), { dateStyle: "medium", timeStyle: "short" })}</td>
          <td>${t(m.direction === "outbound" ? "private.msg_outbound" : "private.msg_inbound")}</td>
          <td style="white-space:normal; word-break:break-word;">${m.body}</td>
          <td><span class="status-pill status-confirmed">${intentLabel(m.llm_parse_result)}</span></td>
          <td><button type="button" class="link" data-delete-message="${m.id}" style="color:#b91c1c;">${t("private.delete_message")}</button></td>
        </tr>`).join("");

      const genderClass = s.contacts?.gender === "female" ? "female" : s.contacts?.gender === "male" ? "male" : "unknown";
      const label = studentLabel(s);
      const initial = (label || "?").trim().charAt(0).toUpperCase() || "?";
      const parentTag = (s.name && s.contacts?.name && s.name !== s.contacts.name)
        ? `<span class="parent-tag" title="${t("private.parent_contact")}">👪 ${s.contacts.name}</span>` : "";
      const regWeekday = s.regular_weekday, regTime = s.regular_time;

      return `
        <tr class="student-row" data-student-id="${s.id}">
          <td><span class="expand-arrow ${isOpen ? "open" : ""}">▶</span></td>
          <td><span class="avatar gender-${genderClass}">${initial}</span>${label}${parentTag}${s.isAiCreated ? ` <span title="${t("private.ai_created_title")}">🤖</span>` : ""}${regWeekday != null && regTime ? `<span class="regular-schedule-badge" role="button" tabindex="0" data-edit-schedule="${s.id}" title="${t("private.edit_schedule")}">🔁 ${formatRegularSchedule(regWeekday, regTime)}</span>` : ""}${s.lastMessageAt ? `<span class="last-activity last-activity-message" title="${t("private.last_message_title")}">💬 ${timeAgo(s.lastMessageAt)}</span>` : ""}</td>
          <td style="text-align:center;">${s.nextLesson ? `<span class="next-lesson-badge">${formatNextLesson(new Date(s.nextLesson.when))}</span>` : `<span class="empty" style="font-size:12px;">${t("private.next_lesson_none")}</span>`}</td>
          <td>${whatsappCell}</td>
          <td><label class="toggle-switch"><input type="checkbox" data-allowed-contact-id="${s.contact_id}" ${s.contacts?.allowed_for_ai ? "checked" : ""} /><span class="slider"></span></label></td>
          <td style="white-space:nowrap;">
            ${regWeekday != null && regTime ? `<button type="button" class="icon-action-btn" data-book-month="${s.id}" title="${t("private.book_month")}" aria-label="${t("private.book_month")}">📅</button>` : ""}
            <button type="button" class="icon-action-btn" data-add-lesson="${s.id}" title="${t("private.new_lesson")}" aria-label="${t("private.new_lesson")}">➕</button>
            <span class="row-menu-wrap">
              <button type="button" class="row-menu-btn" data-row-menu-toggle="${s.id}" title="${t("private.more_actions")}">⋯</button>
              <div class="row-menu" data-row-menu="${s.id}">
                <button type="button" data-edit-student="${s.id}"><span class="menu-icon">✏️</span>${t("student.edit")}</button>
                <button type="button" data-add-sibling="${s.contact_id}"><span class="menu-icon">🧒</span>${t("private.add_sibling")}</button>
                <button type="button" class="danger-item" data-delete-student="${s.id}"><span class="menu-icon">🗑️</span>${t("student.delete")}</button>
              </div>
            </span>
          </td>
        </tr>
        <tr class="student-detail" data-student-detail="${s.id}" style="${isOpen ? "" : "display:none;"}">
          <td></td>
          <td colspan="5">
            <div class="detail-summary">
              <span class="count-pill">${t("private.col_total_lessons")}: ${s.lessons.length}</span>
              <span class="count-pill count-pill-paid">${t("private.col_total_paid")}: $${totalPaid}</span>
            </div>
            <div class="lesson-table-wrap">
              ${s.lessons.length ? `
                <table class="detail-table">
                  <thead><tr>
                    <th data-i18n="private.col_when">When</th>
                    <th data-i18n="private.lesson_format">Format</th>
                    <th data-i18n="private.lesson_price">Price ($)</th>
                    <th data-i18n="attendance.col_attended">Status</th>
                    <th data-i18n="schedule.col_paid">Paid</th>
                    <th></th>
                  </tr></thead>
                  <tbody>${lessonRows}</tbody>
                </table>` : `<p class="empty">${t("private.empty_lessons")}</p>`}
            </div>
            <div class="lesson-table-wrap" style="margin-top:14px;">
              <h3 style="margin:0 0 6px; font-size:13px; color:#71717a;">${t("private.ai_messages_title")}</h3>
              ${s.messages.length ? `
                <table class="detail-table">
                  <thead><tr>
                    <th data-i18n="private.col_when">When</th>
                    <th data-i18n="private.msg_direction">Direction</th>
                    <th data-i18n="private.msg_content">Message</th>
                    <th data-i18n="private.msg_intent">AI intent</th>
                    <th></th>
                  </tr></thead>
                  <tbody>${messageRows}</tbody>
                </table>` : `<p class="empty">${t("private.ai_messages_empty")}</p>`}
            </div>
          </td>
        </tr>`;
    }).join("");
    applyI18n();

    tbody.querySelectorAll(".student-row").forEach(tr => {
      tr.addEventListener("click", () => {
        const id = tr.dataset.studentId;
        if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
        render();
      });
    });

    tbody.querySelectorAll("button[data-edit-student]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); openEditStudent(students.find(s => s.id === btn.dataset.editStudent)); });
    });
    tbody.querySelectorAll("button[data-add-sibling]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); openAddSibling(btn.dataset.addSibling); });
    });
    // The 🔁 regular-schedule badge is a shortcut into the edit dialog
    // (weekday + time live there) — click or keyboard-activate it.
    tbody.querySelectorAll("[data-edit-schedule]").forEach(el => {
      const open = (e) => { e.stopPropagation(); openEditStudent(students.find(s => s.id === el.dataset.editSchedule)); };
      el.addEventListener("click", open);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(e); } });
    });
    tbody.querySelectorAll("button[data-add-lesson]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); openLessonDialog(students.find(s => s.id === btn.dataset.addLesson)); });
    });
    tbody.querySelectorAll("button[data-book-month]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); bookThisMonth(students.find(s => s.id === btn.dataset.bookMonth)); });
    });
    tbody.querySelectorAll("button[data-delete-student]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); deleteStudent(students.find(s => s.id === btn.dataset.deleteStudent)); });
    });

    tbody.querySelectorAll("button[data-row-menu-toggle]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const menu = tbody.querySelector(`.row-menu[data-row-menu="${btn.dataset.rowMenuToggle}"]`);
        const wasOpen = menu.classList.contains("open");
        tbody.querySelectorAll(".row-menu.open").forEach(m => m.classList.remove("open"));
        if (!wasOpen) menu.classList.add("open");
      });
    });

    tbody.querySelectorAll("label.toggle-switch").forEach(label => {
      label.addEventListener("click", (e) => e.stopPropagation());
    });
    tbody.querySelectorAll("input[data-allowed-contact-id]").forEach(cb => {
      cb.addEventListener("click", (e) => e.stopPropagation());
      cb.addEventListener("change", async () => {
        const { error } = await supabaseClient
          .from("contacts").update({ allowed_for_ai: cb.checked }).eq("id", cb.dataset.allowedContactId);
        if (error) { showToast("Update failed: " + error.message, "error"); cb.checked = !cb.checked; }
      });
    });

    tbody.querySelectorAll("input[data-price-appt]").forEach(input => {
      input.addEventListener("click", (e) => e.stopPropagation());
      input.addEventListener("change", async () => {
        const price = parseFloat(input.value) || 0;
        const { error } = await supabaseClient.from("appointments").update({ price }).eq("id", input.dataset.priceAppt);
        if (error) { showToast("Update failed: " + error.message, "error"); return; }
        await load();
      });
    });

    tbody.querySelectorAll("button[data-appt-id]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const status = nextAttendanceStatus(btn.dataset.status) || null;
        const attendanceId = btn.dataset.attendanceId;
        let error;
        if (attendanceId) {
          ({ error } = await supabaseClient
            .from("attendance").update({ status, marked_at: new Date().toISOString() }).eq("id", attendanceId));
        } else {
          ({ error } = await supabaseClient
            .from("attendance").insert({ appointment_id: btn.dataset.apptId, student_id: btn.dataset.studentId, status, marked_at: new Date().toISOString() }));
        }
        if (error) { showToast("Update failed: " + error.message, "error"); return; }
        await load();
      });
    });

    tbody.querySelectorAll("input[data-paid-appt-id]").forEach(cb => {
      cb.addEventListener("click", (e) => e.stopPropagation());
      cb.addEventListener("change", async () => {
        const paid = cb.checked;
        let attendanceId = cb.dataset.paidAttendanceId;
        let error;
        if (attendanceId) {
          ({ error } = await supabaseClient.from("attendance").update({ paid }).eq("id", attendanceId));
        } else {
          ({ error } = await supabaseClient
            .from("attendance").insert({ appointment_id: cb.dataset.paidApptId, student_id: cb.dataset.paidStudentId, paid }));
        }
        if (error) { showToast("Update failed: " + error.message, "error"); cb.checked = !paid; return; }
        await load();
      });
    });

    tbody.querySelectorAll("button[data-delete-lesson]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!(await showConfirm(t("private.delete_lesson_confirm")))) return;
        const apptId = btn.dataset.deleteLesson;
        // A hard delete never fires the calendar-sync Database Webhook
        // (that's only wired up for INSERT/UPDATE), so any Google Calendar
        // event would be orphaned forever. Cancelling instead is an UPDATE,
        // which calendar-sync already handles by deleting the matching
        // event — same pattern used everywhere else appointments get
        // called off (WhatsApp cancellations, the email "Undo" link).
        const { error } = await supabaseClient.from("appointments").update({ status: "cancelled" }).eq("id", apptId);
        if (error) { showToast("Delete failed: " + error.message, "error"); return; }
        await load();
      });
    });

    tbody.querySelectorAll("button[data-delete-message]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (!(await showConfirm(t("private.delete_message_confirm")))) return;
        const messageId = btn.dataset.deleteMessage;
        // pending_actions.message_id has no ON DELETE CASCADE — clear any
        // review-queue row pointing at this message first, same order the
        // student-delete flow already uses, or the message delete below
        // fails on the foreign key.
        await supabaseClient.from("pending_actions").delete().eq("message_id", messageId);
        const { error } = await supabaseClient.from("messages").delete().eq("id", messageId);
        if (error) { showToast("Delete failed: " + error.message, "error"); return; }
        await load();
      });
    });
  }

  // ---------- Student create/edit ----------
  const studentDialog = document.getElementById("student-dialog");
  function setDialogGender(gender) {
    document.getElementById("student-gender").value = gender;
    document.querySelectorAll(".gender-toggle-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.genderOption === gender);
    });
    const avatar = document.getElementById("student-dialog-avatar");
    avatar.className = `dialog-avatar gender-${gender === "female" ? "female" : gender === "male" ? "male" : "unknown"}`;
  }
  document.querySelectorAll(".gender-toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => setDialogGender(btn.dataset.genderOption));
  });
  function openEditStudent(student) {
    if (!student) return;
    const c = student.contacts ?? {};
    const label = studentLabel(student);
    document.getElementById("student-dialog-title").textContent = t("dialog.edit_student");
    document.getElementById("student-id").value = student.id;
    document.getElementById("student-contact-id").value = student.contact_id;
    document.getElementById("student-sibling-contact-id").value = "";
    document.getElementById("student-name").value = label;
    document.getElementById("student-dialog-avatar").textContent = (label || "?").trim().charAt(0).toUpperCase() || "?";
    document.getElementById("student-phone").value = c.whatsapp_number ?? "";
    setDialogGender(c.gender ?? "male");
    document.getElementById("student-social").value = c.social_media_name ?? "";
    document.getElementById("student-level").value = c.level ?? "";
    document.getElementById("student-age").value = c.age ?? "";
    // regular slot is per-student now (migration 0029); fall back to the
    // contact copy for rows not yet backfilled.
    document.getElementById("student-regular-weekday").value = (student.regular_weekday ?? c.regular_weekday) ?? "";
    document.getElementById("student-regular-time").value = (student.regular_time ?? c.regular_time) ?? "";
    const hint = document.getElementById("student-parent-hint");
    const siblings = students.filter(s => s.contact_id === student.contact_id).length;
    if (siblings > 1 && c.name) { hint.textContent = tf("private.same_parent_as", { name: c.name }); hint.hidden = false; }
    else hint.hidden = true;
    studentDialog.showModal();
  }
  function openAddSibling(contactId) {
    const sib = students.find(s => s.contact_id === contactId);
    const c = sib?.contacts ?? {};
    document.getElementById("student-form").reset();
    document.getElementById("student-id").value = "";
    document.getElementById("student-contact-id").value = "";
    document.getElementById("student-sibling-contact-id").value = contactId;
    document.getElementById("student-dialog-title").textContent = t("private.add_sibling");
    document.getElementById("student-dialog-avatar").textContent = "?";
    document.getElementById("student-phone").value = c.whatsapp_number ?? "";
    setDialogGender("female");
    document.getElementById("student-regular-weekday").value = "";
    document.getElementById("student-regular-time").value = "";
    const hint = document.getElementById("student-parent-hint");
    hint.textContent = tf("private.same_parent_as", { name: c.name ?? "" });
    hint.hidden = false;
    studentDialog.showModal();
  }
  document.getElementById("student-search").addEventListener("input", render);
  document.getElementById("new-student-btn").addEventListener("click", () => {
    document.getElementById("student-form").reset();
    document.getElementById("student-id").value = "";
    document.getElementById("student-contact-id").value = "";
    document.getElementById("student-sibling-contact-id").value = "";
    document.getElementById("student-dialog-title").textContent = t("dialog.new_student");
    document.getElementById("student-dialog-avatar").textContent = "?";
    setDialogGender("male");
    document.getElementById("student-regular-weekday").value = "";
    document.getElementById("student-regular-time").value = "";
    document.getElementById("student-parent-hint").hidden = true;
    studentDialog.showModal();
  });
  document.getElementById("student-cancel-btn").addEventListener("click", () => studentDialog.close());

  document.getElementById("student-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const studentId = document.getElementById("student-id").value;
    const contactId = document.getElementById("student-contact-id").value;
    const siblingContactId = document.getElementById("student-sibling-contact-id").value;
    const nameValue = document.getElementById("student-name").value.trim();

    // Per-student identity (migration 0029). Name + regular weekly slot
    // live on the student now so one parent contact can have >1 child.
    const studentFields = {
      name: nameValue || null,
      regular_weekday: document.getElementById("student-regular-weekday").value === "" ? null : parseInt(document.getElementById("student-regular-weekday").value, 10),
      regular_time: document.getElementById("student-regular-time").value || null,
    };
    // Shared, contact-level fields (the parent / WhatsApp identity).
    const contactFields = {
      whatsapp_number: document.getElementById("student-phone").value || null,
      gender: document.getElementById("student-gender").value,
      social_media_name: document.getElementById("student-social").value || null,
      level: document.getElementById("student-level").value || null,
      age: document.getElementById("student-age").value || null,
    };

    // --- Edit an existing student ---
    if (studentId) {
      const { error: sErr } = await supabaseClient.from("students").update(studentFields).eq("id", studentId);
      if (sErr) { showToast("Save failed: " + sErr.message, "error"); return; }
      if (contactId) {
        // Only sync the contact's own name when this is the family's only
        // child — otherwise editing one sibling would rename the parent.
        const soleChild = students.filter(s => s.contact_id === contactId).length <= 1;
        const { error: cErr } = await supabaseClient.from("contacts")
          .update(soleChild && nameValue ? { ...contactFields, name: nameValue } : contactFields).eq("id", contactId);
        if (cErr) { showToast("Save failed: " + cErr.message, "error"); return; }
      }
      studentDialog.close();
      await load();
      return;
    }

    // --- Add another child under an existing parent contact ---
    if (siblingContactId) {
      const { error } = await supabaseClient.from("students")
        .insert({ contact_id: siblingContactId, active: true, is_group: false, ...studentFields });
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
      studentDialog.close();
      await load();
      return;
    }

    // --- New student (may need a new contact) ---
    // This WhatsApp number may already have a contact row — e.g. it
    // messaged in before (auto-created by whatsapp-ingest), or it's an
    // existing lead. Reuse that row instead of blind-inserting, which
    // would otherwise fail on contacts.whatsapp_number's unique constraint.
    let contact = null;
    if (contactFields.whatsapp_number) {
      const { data: existingContact } = await supabaseClient
        .from("contacts").select("id").eq("whatsapp_number", contactFields.whatsapp_number).maybeSingle();
      contact = existingContact;
    }
    if (contact) {
      const { error } = await supabaseClient.from("contacts").update(contactFields).eq("id", contact.id);
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
    } else {
      const { data: newContact, error } = await supabaseClient
        .from("contacts").insert({ ...contactFields, name: nameValue || null, source: "existing_student" }).select().single();
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
      contact = newContact;
    }

    // Likewise, this contact might already be a private student (e.g. she
    // re-adds someone by number without realizing they're already listed)
    // — reactivate that row instead of creating a second one for the same
    // person.
    const { data: existingStudent } = await supabaseClient
      .from("students").select("id").eq("contact_id", contact.id).eq("is_group", false).maybeSingle();
    if (existingStudent) {
      const { error } = await supabaseClient.from("students").update({ active: true, is_group: false, ...studentFields }).eq("id", existingStudent.id);
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
    } else {
      const { error } = await supabaseClient
        .from("students").insert({ contact_id: contact.id, active: true, is_group: false, ...studentFields });
      if (error) { showToast("Save failed: " + error.message, "error"); return; }
    }

    studentDialog.close();
    await load();
  });

  async function deleteStudent(student) {
    if (!student) return;
    if (!(await showConfirm(tf("student.delete_confirm", { name: studentLabel(student) })))) return;

    const { data: appts } = await supabaseClient.from("appointments").select("id").eq("student_id", student.id).is("class_id", null);
    const apptIds = (appts ?? []).map(a => a.id);
    if (apptIds.length) {
      // Cancel first (an UPDATE, which calendar-sync's webhook is wired to)
      // so each Google Calendar event gets removed before the row disappears
      // — a straight DELETE never fires that webhook and would leave the
      // events behind. appointments.student_id has no ON DELETE CASCADE, so
      // the rows still need to actually be deleted afterward or the
      // upcoming student delete would fail with a foreign-key error.
      await supabaseClient.from("appointments").update({ status: "cancelled" }).in("id", apptIds);
      await supabaseClient.from("attendance").delete().in("appointment_id", apptIds);
      const { error } = await supabaseClient.from("appointments").delete().in("id", apptIds);
      if (error) { showToast("Delete failed: " + error.message, "error"); return; }
    }
    const { error: studentError } = await supabaseClient.from("students").delete().eq("id", student.id);
    if (studentError) { showToast("Delete failed: " + studentError.message, "error"); return; }

    // If this parent contact still has other children (or a lead) attached,
    // keep the contact and its WhatsApp history — only the one child was
    // removed. Otherwise clean the contact up as before.
    const { count: remainingStudents } = await supabaseClient
      .from("students").select("id", { count: "exact", head: true }).eq("contact_id", student.contact_id);
    if ((remainingStudents ?? 0) > 0) { await load(); return; }

    // A WhatsApp-linked contact usually has message/review history too —
    // both reference the contact (messages directly, pending_actions via
    // message_id), and neither cascades on its own, so the contact row
    // can't be deleted until they're cleared first.
    const { data: msgs } = await supabaseClient.from("messages").select("id").eq("contact_id", student.contact_id);
    const msgIds = (msgs ?? []).map(m => m.id);
    if (msgIds.length) await supabaseClient.from("pending_actions").delete().in("message_id", msgIds);
    await supabaseClient.from("messages").delete().eq("contact_id", student.contact_id);

    const { error: contactError } = await supabaseClient.from("contacts").delete().eq("id", student.contact_id);
    if (contactError) { showToast("Student deleted, but couldn't remove their contact record: " + contactError.message, "error", 5000); }

    await load();
  }

  // ---------- Add lesson ----------
  const lessonDialog = document.getElementById("lesson-dialog");
  function suggestedPrice(format, duration) {
    if (format === "1on2") return "";
    return duration >= 60 ? 900 : 750;
  }
  function updateLessonPriceSuggestion() {
    const format = document.getElementById("lesson-format").value;
    const duration = parseInt(document.getElementById("lesson-duration").value, 10);
    document.getElementById("lesson-price").value = suggestedPrice(format, duration);
  }
  function openLessonDialog(student) {
    if (!student) return;
    document.getElementById("lesson-form").reset();
    document.getElementById("lesson-student-id").value = student.id;
    document.getElementById("lesson-student-name").textContent = studentLabel(student);
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById("lesson-when").value = now.toISOString().slice(0, 16);
    document.getElementById("lesson-format").value = "1on1";
    document.getElementById("lesson-duration").value = "45";
    updateLessonPriceSuggestion();
    lessonDialog.showModal();
  }
  document.getElementById("lesson-cancel-btn").addEventListener("click", () => lessonDialog.close());
  document.getElementById("lesson-format").addEventListener("change", updateLessonPriceSuggestion);
  document.getElementById("lesson-duration").addEventListener("change", updateLessonPriceSuggestion);

  document.getElementById("lesson-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const studentId = document.getElementById("lesson-student-id").value;
    const whenStr = document.getElementById("lesson-when").value;
    const format = document.getElementById("lesson-format").value;
    const duration = parseInt(document.getElementById("lesson-duration").value, 10);
    const price = parseFloat(document.getElementById("lesson-price").value) || 0;
    if (!studentId || !whenStr) return;

    const start = new Date(whenStr);
    const end = new Date(start.getTime() + duration * 60 * 1000);
    const { data: appt, error } = await supabaseClient
      .from("appointments")
      .insert({
        type: "lesson", lesson_format: format, student_id: studentId,
        scheduled_start: start.toISOString(), scheduled_end: end.toISOString(),
        status: "confirmed", created_via: "manual_dashboard", price,
      })
      .select().single();
    if (error) { showToast("Save failed: " + error.message, "error"); return; }

    const { error: attError } = await supabaseClient
      .from("attendance").insert({ appointment_id: appt.id, student_id: studentId });
    if (attError) { showToast("Lesson saved, but couldn't create its attendance row: " + attError.message, "error", 5000); return; }

    lessonDialog.close();
    await load();
  });

  // ---------- WhatsApp bookings needing review ----------
  // Mirrors the approve/reject logic in supabase/functions/email-actions
  // (the same actions the review email's links trigger) so these can also
  // be handled here without having to go find the email.
  let pendingReviews = [];

  function timeAgo(isoString) {
    const seconds = Math.max(0, Math.floor((Date.now() - new Date(isoString).getTime()) / 1000));
    if (seconds < 60) return t("private.time_just_now");
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return tf("private.time_minutes_ago", { n: minutes });
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return tf("private.time_hours_ago", { n: hours });
    const days = Math.floor(hours / 24);
    return tf("private.time_days_ago", { n: days });
  }

  // Fixed DD/MM/YY(weekday) hh:mmAM/PM format, independent of site
  // language/locale (only the weekday letter itself follows the site
  // language, via the same "day.N" keys packages.html's make-up-date
  // labels already use) — for the "下次上堂" column specifically, per
  // Angela's own preferred format.
  function formatNextLesson(d) {
    const pad = (n) => String(n).padStart(2, "0");
    const day = pad(d.getDate());
    const month = pad(d.getMonth() + 1);
    const year = pad(d.getFullYear() % 100);
    const weekday = t("day." + d.getDay());
    const ampm = d.getHours() >= 12 ? "PM" : "AM";
    const hours12 = d.getHours() % 12 || 12;
    return `${day}/${month}/${year}(${weekday}) ${hours12}:${pad(d.getMinutes())}${ampm}`;
  }

  // "逢四 6:30PM" — same 12h AM/PM convention as formatNextLesson, but for
  // a recurring weekday+time (no specific date) rather than one lesson.
  function formatRegularSchedule(weekday, timeStr) {
    const [h, m] = timeStr.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    const hours12 = h % 12 || 12;
    return `${tf("private.regular_weekly", { weekday: t("day." + weekday) })} ${hours12}:${String(m).padStart(2, "0")}${ampm}`;
  }

  // "This month" = today through the last day of the current calendar
  // month — already-past weeks aren't retroactively booked, and next
  // month's occurrences wait for next month's own click. A regular-day date
  // that already has a lesson at the regular time is left alone (so
  // re-running mid-month is safe); one that already has a lesson at a
  // DIFFERENT time is offered as a "fix its time" instead of silently
  // skipped — that gap is how e.g. lessons booked before the regular slot
  // was set end up stuck at the old time.
  async function bookThisMonth(student) {
    if (!student) return;
    // Per-student regular slot (migration 0029), falling back to the
    // contact copy for rows not yet backfilled.
    const c = {
      regular_weekday: student.regular_weekday ?? student.contacts?.regular_weekday,
      regular_time: student.regular_time ?? student.contacts?.regular_time,
    };
    if (c.regular_weekday == null || !c.regular_time) return;

    const now = new Date();
    const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const [h, m] = c.regular_time.split(":").map(Number);

    const existingByDateKey = new Map(student.lessons.map(l => [new Date(l.when).toDateString(), l]));
    const candidateDates = [];
    const mismatched = []; // { lesson, start } — same regular day, wrong time
    for (let d = new Date(now.getFullYear(), now.getMonth(), now.getDate()); d < endOfMonth; d.setDate(d.getDate() + 1)) {
      if (d.getDay() !== c.regular_weekday) continue;
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
      if (start < now) continue; // today's slot already passed
      const existing = existingByDateKey.get(start.toDateString());
      if (existing) {
        const cur = new Date(existing.when);
        if (cur.getHours() !== h || cur.getMinutes() !== m) mismatched.push({ lesson: existing, start });
        continue; // right time already, or queued for a time fix
      }
      candidateDates.push(start);
    }

    const weekdayLabel = t("day." + c.regular_weekday);
    if (!candidateDates.length && !mismatched.length) {
      showToast(tf("private.book_month_none", { weekday: weekdayLabel }), "default");
      return;
    }

    // Reuse the most recently-booked lesson's price/format as the template
    // — falls back to the same defaults the "New lesson" dialog itself uses
    // for a student with no lessons yet at all. Duration isn't tracked on
    // the loaded lesson list, so this always uses the standard 45min, same
    // as that dialog's own default.
    const template = student.lessons[0]; // lessons are ordered newest-first (see load())
    const format = template?.format ?? "1on1";
    const price = template?.price ?? 750;
    const durationMin = 45;

    let changed = false;

    if (candidateDates.length &&
