<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Violin Studio — Operations Overview</title>
<link rel="stylesheet" href="shared.css" />
<link rel="icon" href="logo.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  .acct-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 600px) { .acct-grid { grid-template-columns: 1fr; } }
  .acct-card { display: flex; flex-direction: column; gap: 10px; }
  .acct-card h2 { font-size: 14px; margin: 0; color: #52525b; font-weight: 600; }
  .acct-trend { font-size: 12px; font-weight: 600; }
  .acct-trend.up { color: #1e6b34; }
  .acct-trend.down { color: #b91c1c; }
  .acct-trend.flat { color: #a1a1aa; }
  .acct-donut-row { display: flex; align-items: center; gap: 22px; }
  .acct-donut-row canvas { width: 96px !important; height: 96px !important; flex-shrink: 0; }
  .acct-legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .acct-legend-item { display: flex; align-items: center; gap: 6px; }
  .acct-legend-item b { margin-left: auto; }
  .acct-legend-total { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f0f0f1; font-weight: 600; }
  .acct-legend-total b { margin-left: auto; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .dot-paid { background: #1e6b34; }
  .dot-unpaid { background: #d4d4d8; }
  .acct-stat-number { font-size: 32px; font-weight: 700; color: #18181b; }
  .acct-card-footer { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .acct-note { font-size: 10px; line-height: 1.4; color: #71717a; margin: 0; }
</style>
</head>
<body>
<header class="topnav">
  <span class="brand"><img src="logo.png" alt="" class="brand-logo">Violin Studio</span>
  <a href="index.html" data-i18n="nav.schedule">Schedule</a>
  <a href="leads.html" data-i18n="nav.leads">Leads</a>
  <a href="packages.html" data-i18n="nav.packages">Group Classes</a>
  <a href="private.html" data-i18n="nav.private">Private Students</a>
  <a href="receipt.html" data-i18n="nav.receipt">Receipt</a>
  <a href="accounting.html" class="active" data-i18n="nav.accounting">Accounting</a>
  <span class="spacer"></span>
  <div class="settings-wrap">
    <button id="settings-btn" title="Settings">⚙️</button>
    <div id="settings-menu" class="settings-menu" style="display:none;">
      <button id="settings-lang-toggle" data-lang-toggle>中文</button>
      <button id="settings-export-btn" data-i18n="settings.export_data">Export all data (Excel)</button>
    </div>
  </div>
  <button id="logout-btn" data-i18n="nav.logout">Log out</button>
</header>
<main>
  <div class="card">
    <h1 style="margin:0 0 14px;" data-i18n="accounting.title">Accounting</h1>
    <div class="acct-grid">

      <div class="card acct-card" style="margin:0;">
        <h2 data-i18n="accounting.revenue_title">This Month's Revenue</h2>
        <div class="acct-donut-row">
          <canvas id="revenue-chart" width="96" height="96"></canvas>
          <div class="acct-legend">
            <div class="acct-legend-item"><span class="dot dot-paid"></span><span data-i18n="accounting.paid">Paid</span><b id="revenue-paid">$0</b></div>
            <div class="acct-legend-item"><span class="dot dot-unpaid"></span><span data-i18n="accounting.unpaid">Outstanding</span><b id="revenue-unpaid">$0</b></div>
            <div class="acct-legend-total"><span data-i18n="accounting.total">Total</span><b id="revenue-total">$0</b></div>
          </div>
        </div>
        <span class="acct-trend" id="revenue-trend"></span>
        <p class="acct-note" id="revenue-prev-month"></p>
      </div>

      <div class="card acct-card" style="margin:0;">
        <h2 data-i18n="accounting.new_students_title">New Students This Month</h2>
        <div class="acct-stat-number" id="new-students-count">0</div>
        <span class="acct-trend" id="new-students-trend"></span>
      </div>

      <div class="card acct-card" style="margin:0;">
        <h2 data-i18n="accounting.churn_title">Student Churn Rate</h2>
        <div class="acct-stat-number" id="churn-rate">—</div>
        <span class="acct-trend" id="churn-trend"></span>
        <p class="acct-note" id="churn-names" style="color:#52525b; font-size:12px;"></p>
        <div class="acct-card-footer">
          <p class="acct-note" data-i18n="accounting.churn_note">* Churn rate definition.</p>
        </div>
      </div>

      <div class="card acct-card" style="margin:0;">
        <h2 data-i18n="accounting.conversion_title">Lead Conversion Rate</h2>
        <div class="acct-stat-number" id="conversion-rate">—</div>
        <span class="acct-trend" id="conversion-trend"></span>
        <div class="acct-card-footer">
          <p class="acct-note" data-i18n="accounting.conversion_note">* Conversion rate definition.</p>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="i18n.js"></script>
<script src="settings.js"></script>
<script>
(async () => {
  const session = await requireSession();
  if (!session) return;
  wireLogoutButton(document.getElementById("logout-btn"));
  applyI18n();
  initSettingsMenu();
  window.onLangChange = () => load();

  // A package's "N lessons" are the first N real appointments on/after its
  // start_date — mirrors packages.html's own getPackageLessonAppointments,
  // duplicated here since this page has no way to import it (no build step,
  // no shared modules across pages in this codebase).
  async function getPackageLessonAppointments(classId, startDate, totalLessons) {
    const { data } = await supabaseClient
      .from("appointments").select("id")
      .eq("class_id", classId).gte("scheduled_start", startDate)
      .order("scheduled_start", { ascending: true }).limit(totalLessons);
    return data ?? [];
  }

  function monthBounds(offsetMonths) {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth() + offsetMonths, 1);
    const end = new Date(now.getFullYear(), now.getMonth() + offsetMonths + 1, 1);
    const toDateStr = (d) => d.toISOString().slice(0, 10);
    return { startDateStr: toDateStr(start), endDateStr: toDateStr(end), startIso: start.toISOString(), endIso: end.toISOString() };
  }

  function renderTrend(el, current, previous, { higherIsBetter = true, isPercent = false } = {}) {
    if (previous === null || previous === undefined || previous === 0) {
      el.textContent = t("accounting.no_data");
      el.className = "acct-trend flat";
      return;
    }
    const diff = current - previous;
    if (Math.abs(diff) < 0.001) {
      el.textContent = t("accounting.no_change");
      el.className = "acct-trend flat";
      return;
    }
    const pctChange = Math.abs((diff / previous) * 100).toFixed(0);
    const up = diff > 0;
    const good = higherIsBetter ? up : !up;
    el.textContent = `${up ? "↑" : "↓"} ${pctChange}% ${t("accounting.vs_last_month")}`;
    el.className = "acct-trend " + (good ? "up" : "down");
  }

  // ---------- One shared fetch for everything but revenue ----------
  // New-students / currently-enrolled / churn all only need cheap fields
  // off the same "every group-class package" list — fetching it once here
  // and deriving all three in memory (instead of three separate queries,
  // two of them re-fetching the whole table again for "last month") is
  // what actually made this page slow before.
  async function fetchAllGroupPackages() {
    const { data } = await supabaseClient
      .from("packages")
      .select("student_id, start_date, status, created_at, cancelled_at, students!inner(is_group, contacts(name))")
      .eq("students.is_group", true)
      .order("created_at", { ascending: false });
    return data ?? [];
  }

  // "New" = their very first-ever group package's start_date falls in this
  // month — a renewal into a new term doesn't count as a new student.
  function countNewStudents(allPkgs, startDateStr, endDateStr) {
    const earliestByStudent = new Map();
    for (const p of allPkgs) {
      const prev = earliestByStudent.get(p.student_id);
      if (!prev || p.start_date < prev) earliestByStudent.set(p.student_id, p.start_date);
    }
    let count = 0;
    for (const startDate of earliestByStudent.values()) {
      if (startDate >= startDateStr && startDate < endDateStr) count++;
    }
    return count;
  }

  // currentlyEnrolled = group students whose latest package is still
  // "active" (not cancelled), counted right now (allPkgs is already sorted
  // newest-created-first, so the first row seen per student is the latest.
  function latestStatusByStudent(allPkgs) {
    const map = new Map();
    for (const p of allPkgs) {
      if (!map.has(p.student_id)) map.set(p.student_id, p.status);
    }
    return map;
  }

  function countCurrentlyEnrolled(allPkgs) {
    return [...latestStatusByStudent(allPkgs).values()].filter(status => status !== "cancelled").length;
  }

  // churned = group packages cancelled within the given month, EXCLUDING a
  // student whose most recent package overall is still active — that's a
  // class transfer or straight renewal (e.g. moved from C Class to A
  // Class), not the student actually leaving the studio. Rate (in load()
  // below) = churned ÷ (currentlyEnrolled + churned) — i.e. churned is
  // added back to approximate "how many were enrolled at the start of the
  // month".
  function findChurned(allPkgs, startIso, endIso) {
    const latestStatus = latestStatusByStudent(allPkgs);
    const byStudent = new Map();
    for (const p of allPkgs) {
      if (p.status !== "cancelled" || p.cancelled_at < startIso || p.cancelled_at >= endIso) continue;
      if (latestStatus.get(p.student_id) !== "cancelled") continue; // still active elsewhere — a transfer, not churn
      byStudent.set(p.student_id, p.students?.contacts?.name ?? "");
    }
    return { count: byStudent.size, names: [...byStudent.values()].filter(Boolean) };
  }

  // ---------- Revenue (group classes only) ----------
  // Fully reconciled — mirrors packages.html's Payments tab math exactly
  // (effectivePrice: price minus deductible leaves minus incoming deferred
  // credits from an earlier package, plus extra fees tracked separately)
  // rather than the flat "price" this used to show.
  function isDeductible(row) {
    return row.status === "leave" && row.make_up_status === "pending";
  }
  function effectivePrice(pkg, lessons) {
    const perLessonPrice = pkg.price / pkg.total_lessons;
    const ownDeduction = lessons.filter(isDeductible).length * perLessonPrice;
    return Math.max(0, pkg.price - ownDeduction - (pkg.incomingCreditAmount ?? 0));
  }
  function extraFeeLessons(lessons) {
    return lessons.filter(l => l.make_up_status === "combined_with_private" && l.make_up_extra_fee != null);
  }
  async function getIncomingCreditAmounts(packageIds) {
    const amounts = new Map();
    if (!packageIds.length) return amounts;
    const { data } = await supabaseClient
      .from("attendance").select("deferred_credit_used_in_package_id, deferred_credit_amount")
      .in("deferred_credit_used_in_package_id", packageIds);
    (data ?? []).forEach(r => amounts.set(r.deferred_credit_used_in_package_id, (amounts.get(r.deferred_credit_used_in_package_id) ?? 0) + (r.deferred_credit_amount ?? 0)));
    return amounts;
  }

  async function computeRevenue(startDateStr, endDateStr) {
    const { data: pkgs } = await supabaseClient
      .from("packages")
      .select("id, class_id, student_id, start_date, total_lessons, price, students!inner(is_group)")
      .eq("students.is_group", true)
      .gte("start_date", startDateStr).lt("start_date", endDateStr);

    const incomingCreditAmounts = await getIncomingCreditAmounts((pkgs ?? []).map(p => p.id));

    // Each package needs its own two lookups (lesson appointments, then
    // their attendance rows) — running the packages concurrently instead
    // of one at a time is what keeps this fast when several packages
    // started in the same month.
    const perPackage = await Promise.all((pkgs ?? []).map(async (p) => {
      p.incomingCreditAmount = incomingCreditAmounts.get(p.id) ?? 0;
      if (!p.total_lessons) return { total: p.price ?? 0, paidAmount: 0 };
      const apptRows = await getPackageLessonAppointments(p.class_id, p.start_date, p.total_lessons);
      if (!apptRows.length) return { total: p.price ?? 0, paidAmount: 0 };
      const apptIds = apptRows.map(a => a.id);
      const { data: attRows } = await supabaseClient
        .from("attendance")
        .select("appointment_id, status, make_up_status, make_up_extra_fee, make_up_extra_fee_paid, paid")
        .eq("student_id", p.student_id).in("appointment_id", apptIds);
      const lessons = apptRows.map(a => {
        const att = (attRows ?? []).find(r => r.appointment_id === a.id);
        return {
          status: att?.status ?? null, make_up_status: att?.make_up_status ?? null,
          make_up_extra_fee: att?.make_up_extra_fee ?? null, make_up_extra_fee_paid: att?.make_up_extra_fee_paid ?? false,
          paid: att?.paid ?? false,
        };
      });

      const effPrice = effectivePrice(p, lessons);
      const paidCount = lessons.filter(l => l.paid).length;
      // Each paid lesson is worth exactly one lesson's share of the price —
      // NOT effPrice proportioned across total_lessons, which understates a
      // student who paid for every billable lesson but also had a
      // deducted/free leave mixed into the same package.
      const paidFromLessons = p.total_lessons ? (p.price / p.total_lessons) * paidCount : 0;

      const extraLessons = extraFeeLessons(lessons);
      const extraFeeTotal = extraLessons.reduce((sum, l) => sum + Number(l.make_up_extra_fee), 0);
      const extraFeePaid = extraLessons.filter(l => l.make_up_extra_fee_paid).reduce((sum, l) => sum + Number(l.make_up_extra_fee), 0);

      return { total: effPrice + extraFeeTotal, paidAmount: paidFromLessons + extraFeePaid };
    }));

    const total = perPackage.reduce((sum, r) => sum + r.total, 0);
    const paid = perPackage.reduce((sum, r) => sum + r.paidAmount, 0);
    return { total: Math.round(total), paid: Math.round(paid), unpaid: Math.round(total - paid) };
  }

  // ---------- Lead conversion rate ----------
  // Counts every lead (private or group destination — leads.html itself
  // doesn't distinguish) that reached a final outcome (converted or lost)
  // this month, by when its status last changed (updated_at).
  async function computeConversion(startIso, endIso) {
    const { data } = await supabaseClient
      .from("leads").select("status")
      .in("status", ["converted", "lost"])
      .gte("updated_at", startIso).lt("updated_at", endIso);
    const converted = (data ?? []).filter(r => r.status === "converted").length;
    const lost = (data ?? []).filter(r => r.status === "lost").length;
    return { converted, lost, total: converted + lost };
  }

  // Counts a stat number up from 0 to its final value instead of just
  // popping the text in — parses the numeric part out of whatever
  // formatting the caller already produced ($1,234 / 12 / 34% / —), so the
  // exact final string (currency sign, thousands separators, % sign) is
  // always what's left on screen once the animation ends.
  function animateNumber(el, finalText, duration = 700) {
    const match = String(finalText).match(/^([^\d-]*)(-?[\d,]+(?:\.\d+)?)(.*)$/);
    if (!match) { el.textContent = finalText; return; } // e.g. "—" (no data)
    const [, prefix, numStr, suffix] = match;
    const target = parseFloat(numStr.replace(/,/g, ""));
    const decimals = numStr.includes(".") ? numStr.split(".")[1].length : 0;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      if (progress >= 1) { el.textContent = finalText; return; }
      const value = target * eased;
      el.textContent = `${prefix}${value.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}${suffix}`;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function drawDonut(paid, unpaid) {
    const ctx = document.getElementById("revenue-chart");
    if (window.__revenueChart) window.__revenueChart.destroy();
    window.__revenueChart = new Chart(ctx, {
      type: "doughnut",
      data: {
        datasets: [{
          data: [paid, unpaid] ,
          backgroundColor: ["#1e6b34", "#d4d4d8"],
          borderWidth: 0,
        }],
      },
      options: { cutout: "70%", plugins: { legend: { display: false }, tooltip: { enabled: false } }, animation: false },
    });
  }

  async function load() {
    const thisMonth = monthBounds(0);
    const lastMonth = monthBounds(-1);

    // Revenue (needs its own per-package appointment/attendance lookups)
    // and the shared package list (for new-students/enrolled/churn) run
    // concurrently — neither depends on the other.
    const [[revenueNow, revenuePrev], allGroupPkgs] = await Promise.all([
      Promise.all([
        computeRevenue(thisMonth.startDateStr, thisMonth.endDateStr),
        computeRevenue(lastMonth.startDateStr, lastMonth.endDateStr),
      ]),
      fetchAllGroupPackages(),
    ]);
    animateNumber(document.getElementById("revenue-paid"), `$${revenueNow.paid}`);
    animateNumber(document.getElementById("revenue-unpaid"), `$${revenueNow.unpaid}`);
    animateNumber(document.getElementById("revenue-total"), `$${revenueNow.total}`);
    drawDonut(revenueNow.paid, revenueNow.unpaid);
    renderTrend(document.getElementById("revenue-trend"), revenueNow.total, revenuePrev.total);
    document.getElementById("revenue-prev-month").textContent = tf("accounting.prev_month_revenue", { amount: revenuePrev.total });

    const newNow = countNewStudents(allGroupPkgs, thisMonth.startDateStr, thisMonth.endDateStr);
    const newPrev = countNewStudents(allGroupPkgs, lastMonth.startDateStr, lastMonth.endDateStr);
    animateNumber(document.getElementById("new-students-count"), String(newNow));
    renderTrend(document.getElementById("new-students-trend"), newNow, newPrev);

    const enrolledNow = countCurrentlyEnrolled(allGroupPkgs);
    const churnedNow = findChurned(allGroupPkgs, thisMonth.startIso, thisMonth.endIso);
    const churnedPrev = findChurned(allGroupPkgs, lastMonth.startIso, lastMonth.endIso);
    // Shown as a headcount, not a percentage — "3 students left" is easier
    // to act on at a glance than "25.0%". The rate is still computed and
    // shown in small text underneath for reference.
    const churnRateNow = (churnedNow.count + enrolledNow) > 0 ? (churnedNow.count / (churnedNow.count + enrolledNow)) * 100 : 0;
    animateNumber(document.getElementById("churn-rate"), String(churnedNow.count));
    renderTrend(document.getElementById("churn-trend"), churnedNow.count, churnedPrev.count, { higherIsBetter: false });
    document.getElementById("churn-names").textContent = churnedNow.names.length
      ? `${churnRateNow.toFixed(1)}% — ${churnedNow.names.join("、")}`
      : t("accounting.no_churn_names");

    const [convNow, convPrev] = await Promise.all([
      computeConversion(thisMonth.startIso, thisMonth.endIso),
      computeConversion(lastMonth.startIso, lastMonth.endIso),
    ]);
    const convRateNow = convNow.total > 0 ? (convNow.converted / convNow.total) * 100 : null;
    const convRatePrev = convPrev.total > 0 ? (convPrev.converted / convPrev.total) * 100 : null;
    animateNumber(document.getElementById("conversion-rate"), convRateNow === null ? "—" : `${convRateNow.toFixed(0)}%`);
    if (convRateNow === null) {
      document.getElementById("conversion-trend").textContent = t("accounting.no_data");
      document.getElementById("conversion-trend").className = "acct-trend flat";
    } else {
      renderTrend(document.getElementById("conversion-trend"), convRateNow, convRatePrev);
    }
  }

  await load();
})();
</script>
</body>
</html>
